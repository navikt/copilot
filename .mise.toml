# Root-level mise tasks for the monorepo
#
# Orchestrates running tasks across all applications.
# Each app defines its own tasks in apps/<name>/.mise.toml.
#
# Standard tasks (delegated to each app):
#   check, test, build, update
#
# Selective tasks (only apps that need them):
#   generate — copilot-api, mcp-onboarding, my-copilot
#
# Root-only tasks:
#   docs:*    — documentation generation and checking
#   ratchet:* — GitHub Actions SHA pinning
#   all       — full pipeline: generate → check → build

[tools]
"go:github.com/sethvargo/ratchet" = "latest"
lefthook = "2.1.9"
node = "24"
pnpm = "11"
shellcheck = "latest"
bats = "latest"

[env]
APPS = "copilot-adoption copilot-api copilot-cli copilot-survey copilot-metrics mcp-onboarding mcp-registry my-copilot"
APPS_WITH_GENERATE = "copilot-api mcp-onboarding my-copilot"
# Skip Go's VCS stamping (vcs.revision in the binary). Nothing here reads it:
# nav-pilot takes version/commit from -ldflags, and the Dockerfiles and the
# release workflow do not run through mise. Stamping breaks `go build` in a
# linked git worktree under cplt (Go ignores the worktree's .git file, walks up
# to a parent repo and runs git where the sandbox cannot read; navikt/cplt#617).
# This only applies to processes mise starts. A bare `go build` in a linked
# worktree inside cplt still fails until navikt/cplt#617 (PR navikt/cplt#624)
# ships, which lets GOFLAGS through from the shell. `mise run build` in CI also
# loses VCS stamps; nothing reads them.
GOFLAGS = "-buildvcs=false"

# ─── Local development ───────────────────────────────────────────────────────

[tasks.dev]
description = "Start copilot-api (:8080) and my-copilot (:3000) with hot reload"
run = "bash hack/dev.sh"

# ─── Pipeline ────────────────────────────────────────────────────────────────

[tasks.all]
description = "Full pipeline: generate, check, build"
run = "bash hack/all.sh"

# ─── Standard tasks (delegated to all apps) ──────────────────────────────────

[tasks.check]
description = "Run all checks across all apps"
run = "bash hack/check.sh"

[tasks.test]
description = "Run tests across all apps"
run = "bash hack/test.sh"

[tasks.build]
description = "Build all apps"
run = "bash hack/build.sh"

[tasks.update]
description = "Update dependencies across all apps"
run = "bash hack/update.sh"

# ─── Generate (only apps that have generate tasks) ───────────────────────────

[tasks.generate]
description = "Generate all generated files"
run = "bash hack/generate.sh"

# ─── Docs ────────────────────────────────────────────────────────────────────

[tasks."retired:generate"]
description = "Record which artifacts the source has retired, from git history"
run = "(cd scripts/generate-retired && go run .)"

[tasks."retired:check"]
description = "Verify the retired-artifact record matches git history"
run = "(cd scripts/generate-retired && go run . --check)"

[tasks."docs:generate"]
description = "Generate docs from customization files"
run = "(cd scripts/generate-docs && go run .)"

[tasks."docs:check"]
description = "Check if docs are in sync with customization files"
run = "(cd scripts/generate-docs && go run . --check)"

# ─── Skills ──────────────────────────────────────────────────────────────────

[tasks."skills:lint"]
description = "Lint skills/ for quality (token budget, structure, metadata, review contract)"
run = """
set -e
bash scripts/lint-skills.sh
bash scripts/test-lint-skills.sh
"""



[tasks."hooks:test"]
description = "Selvtest for hooks/ (preToolUse-portene), og sjekk at .github/hooks/ er identisk med kilden"
run = """
set -e
python3 hooks/ask-first-aria.py --selftest
python3 hooks/klarsprak-gate.py --selftest
python3 hooks/gh-poll-gate.py --selftest
# hooks/ er kilden nav-pilot installerer fra; .github/hooks/ er dette repoets
# egen installasjon av den, som Copilot CLI faktisk leser. To kopier råtner hvis
# ingen sjekker dem, og en port som har drevet fra kilden er ingen port.
for f in hooks/*.py; do
  diff -q "$f" ".github/hooks/$(basename "$f")"
done
"""

# ─── Pricing ──────────────────────────────────────────────────────────────────

[tasks."pricing:check"]
description = "Check if model pricing data is in sync with GitHub docs"
run = "node scripts/sync-model-pricing.mjs --check"

[tasks."pricing:test"]
description = "Test the pricing parser, including the promotion footnotes"
run = "node --test scripts/sync-model-pricing.test.mjs"

[tasks."pricing:sync"]
description = "Fetch latest model pricing from GitHub docs and update data file"
run = "node scripts/sync-model-pricing.mjs"

[tasks."models:check"]
description = "Check if the Copilot model picker is in sync with the models.dev catalog"
run = "node scripts/sync-copilot-models.mjs --check"

[tasks."models:test"]
description = "Test the model-catalog generator (fixture feed + malformed-feed guards)"
run = "node --test scripts/sync-copilot-models.test.mjs"

[tasks."models:sync"]
description = "Fetch the models.dev github-copilot catalog and regenerate the picker"
run = "node scripts/sync-copilot-models.mjs"

[tasks."benchmark:check"]
description = "Benchmark check selftests, and docs/golden-baselines/summary.json matches the committed runs"
run = """
set -e
python3 scripts/benchmark-sjekk.py --selftest
python3 scripts/benchmark-summary.py --selftest
python3 scripts/benchmark-summary.py --check
"""

[tasks."benchmark:summary"]
description = "Regenerate docs/golden-baselines/summary.json from the committed benchmark runs"
run = "python3 scripts/benchmark-summary.py"

[tasks."local-models:check"]
description = "Check if the fallback local-model table (referanse, forklaring/lokal-modell) matches the mlx-workspace manifest"
run = "node scripts/sync-local-models.mjs --check"

[tasks."local-models:test"]
description = "Test the local-model manifest validation and the page loader"
run = "pnpm --dir apps/my-copilot exec vitest run src/lib/local-models"

[tasks."local-models:sync"]
description = "Fetch the mlx-workspace model manifest and regenerate the fallback local-model table"
run = "node scripts/sync-local-models.mjs"

# ─── nav-pilot installer ─────────────────────────────────────────────────────

[tasks."nav-pilot:build"]
description = "Build nav-pilot installer CLI"
run = """
LDFLAGS="-X main.version=dev -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
(cd cli/nav-pilot && go build -ldflags "$LDFLAGS" -o nav-pilot .)
"""

[tasks."nav-pilot:test"]
description = "Run nav-pilot installer tests"
# TestLaunchBudget times nav-pilot, so it runs alone and without -race
# (nav-pilot:budget), as in CI. Under -race beside the other packages it times
# the machine instead and fails.
run = "(cd cli/nav-pilot && go test -race -skip TestLaunchBudget ./...)"

[tasks."nav-pilot:budget"]
description = "Run nav-pilot's launch-time budget test alone, without -race (as CI does)"
run = "(cd cli/nav-pilot && go test ./e2e -run TestLaunchBudget -count=1)"

# The Go half and the script half share nothing, so mise runs them side by side.
# --continue-on-error: without it mise sends SIGTERM to the half still running
# when the other fails. Killed mid-run, bats removes its temp dir while its
# tests keep going, and the log fills with "bats-run-…: No such file or
# directory" and "Executed 46 instead of expected 73 tests" on top of the
# failure that stopped it.
[tasks."nav-pilot:check"]
description = "Run all nav-pilot checks (mirrors CI: build, test, vet, staticcheck, shellcheck, bats); the launch budget is nav-pilot:budget"
run = "mise run --continue-on-error nav-pilot:check:go ::: nav-pilot:check:scripts"

[tasks."nav-pilot:check:go"]
description = "nav-pilot build, test, vet, staticcheck"
dir = "cli/nav-pilot"
run = """
set -e
go build -o /dev/null .
go test -race -skip TestLaunchBudget ./... # see nav-pilot:test
go vet ./...
go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
"""

[tasks."nav-pilot:check:scripts"]
description = "nav-pilot usage selftest, shellcheck, bats"
run = """
set -e
python3 scripts/copilot-usage.py --selftest
shellcheck scripts/install.sh scripts/subagent-pin-canary.sh skills/*/*.sh
bats scripts/install.bats scripts/sync-pr-body.bats scripts/skill-selvutlosning-probe.bats scripts/nav-pilot-golden.bats scripts/obs-query.bats
"""

[tasks."canary:subagent-pin"]
description = "Check that Copilot CLI runs a subagent on its model pin (spends ~0.1-0.5 AI credit; isolated COPILOT_HOME)"
run = "scripts/subagent-pin-canary.sh"

[tasks."nav-pilot:install"]
description = "Build and install nav-pilot CLI to GOBIN"
run = """
LDFLAGS="-X main.version=dev -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
cd cli/nav-pilot && go build -ldflags "$LDFLAGS" -o nav-pilot .
DEST="${GOBIN:-${GOPATH:-$HOME/go}/bin}"
mkdir -p "$DEST"
mv nav-pilot "$DEST/nav-pilot"
echo "✓ Installed nav-pilot to $DEST/nav-pilot"
"""

[tasks."nav-pilot:cover"]
description = "Run nav-pilot tests with coverage and print summary (cleans up cover.out)"
run = """
cd cli/nav-pilot && \
go test -race -skip TestLaunchBudget -coverpkg=./... -coverprofile=cover.out ./... && \
echo "" && \
go tool cover -func=cover.out && \
echo "" && \
go tool cover -func=cover.out | tail -1 && \
rm -f cover.out
"""

# ─── Ratchet (GitHub Actions pinning) ────────────────────────────────────────

[tasks."ratchet:pin"]
description = "Pin GitHub Actions to specific commit SHAs"
run = "ratchet pin .github/workflows/*.y?ml"

[tasks."ratchet:update"]
description = "Update pinned GitHub Actions to latest versions"
run = "ratchet update .github/workflows/*.y?ml"

[tasks."ratchet:lint"]
description = "Check if GitHub Actions are properly pinned"
run = "ratchet lint .github/workflows/*.y?ml"

[tasks."ratchet:unpin"]
description = "Unpin GitHub Actions (restore to tags)"
run = "ratchet unpin .github/workflows/*.y?ml"
