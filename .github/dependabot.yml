# Få og forutsigbare PR-er: én oppføring per økosystem, alle kataloger samlet
# med `directories`, fast tidspunkt mandag morgen. Per økosystem blir det
# høyst tre PR-er: minor+patch, major og sikkerhet.
# Referanse: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Bevisst utelatt:
# - docker: basebildene bruker flytende tagger (golang:1.26-alpine,
#   distroless, chainguard), og Go-versjonen styres av go.mod.
# - pip (cli/nav-pilot/internal/local/requirements.txt): regenereres med
#   hasher fra versjonene i runtime.go. Sikkerhetsvarsler kommer uansett.
version: 2
registries:
  # Pakker fra GitHub Packages (@nais/apm fra #2026) krever token også for
  # offentlige pakker. READER_TOKEN er navikt-org-hemmeligheten, samme
  # mønster som navikt/aksel; den må finnes som Dependabot-hemmelighet.
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@nais"
    token: ${{ secrets.READER_TOKEN }}
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        # Kompilerte lock-filer skal ikke SHA-patches av Dependabot — de
        # genereres fra kilden (f.eks. `gh aw compile`). Da #428 og #433
        # oppdaterte news-excerpts.lock.yml direkte, kom SHA-ene ut av takt
        # med filas eget manifest og workflowen sluttet å kjøre (#443).
        exclude-patterns:
          - "*.lock.yml"
    open-pull-requests-limit: 3

  # Alle Go-moduler i én oppføring. Én PR per gruppe på tvers av katalogene.
  - package-ecosystem: "gomod"
    directories:
      - "/apps/copilot-adoption"
      - "/apps/copilot-api"
      - "/apps/copilot-cli"
      - "/apps/copilot-metrics"
      - "/apps/copilot-survey"
      - "/apps/fleet-gateway"
      - "/apps/mcp-onboarding"
      - "/apps/mcp-registry"
      - "/apps/fleet-gateway/echo"
      - "/cli/nav-pilot"
      - "/scripts/generate-docs"
      - "/scripts/generate-retired"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      go-major:
        applies-to: version-updates
        update-types: ["major"]
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # my-copilot (Next.js, pnpm)
  - package-ecosystem: "npm"
    directory: "/apps/my-copilot"
    registries:
      - npm-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # Major-oppgraderinger (next, react, @navikt/ds-*, eslint …) i egen PR
      # som et menneske vurderer.
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript 7 er holdt tilbake på 6.x. eslint-config-next trekker inn
      # typescript-eslint, som per 8.70.0 (siste) sier `typescript: ">=4.8.4
      # <6.1.0"` og avbryter med «typescript-eslint does not support TS 7.0».
      # Da faller `pnpm lint` på første fil. `tsc --noEmit` er grønn på TS 7 —
      # det er kun linten som stopper. Løft dette når typescript-eslint
      # støtter TS >= 7 (github.com/typescript-eslint/typescript-eslint#10940)
      # og eslint-config-next har fått den versjonen.
      - dependency-name: "typescript"
        versions: [">=7"]
    open-pull-requests-limit: 3

  # Frozen benchmark fixture: run results record its fixture hash, so bumps
  # would invalidate the baselines. Limit 0 turns off version updates here.
  - package-ecosystem: "npm"
    directory: "/benchmark/realistic/typescript/incident/workspace"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # Security updates ignore the limit above, so ignore every dependency too.
    ignore:
      - dependency-name: "*"
