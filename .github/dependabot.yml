version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      github-actions:
        patterns:
          - "*"
        # Kompilerte lock-filer skal ikke SHA-patches av Dependabot — de
        # genereres fra kilden (f.eks. `gh aw compile`). Da #428 og #433
        # oppdaterte news-excerpts.lock.yml direkte, kom SHA-ene ut av takt
        # med filas eget manifest og workflowen sluttet å kjøre (#443).
        exclude-patterns:
          - "*.lock.yml"
    open-pull-requests-limit: 5

  # my-copilot (Next.js)
  - package-ecosystem: "npm"
    directory: "/apps/my-copilot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      nextjs-core:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      navikt:
        patterns:
          - "@navikt/*"
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@navikt/*"
    ignore:
      # TypeScript 7 er holdt tilbake på 6.x. eslint-config-next trekker inn
      # typescript-eslint, som per 8.70.0 (siste) sier `typescript: ">=4.8.4
      # <6.1.0"` og avbryter med «typescript-eslint does not support TS 7.0».
      # Da faller `pnpm lint` på første fil. `tsc --noEmit` er grønn på TS 7 —
      # det er kun linten som stopper. Løft dette når typescript-eslint
      # støtter TS >= 7 (github.com/typescript-eslint/typescript-eslint#10940)
      # og eslint-config-next har fått den versjonen.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Next 16.3.x knekker produksjonsbygget. Turbopack følger pnpm-symlenken
      # node_modules/**/@img/sharp-libvips-* under outputFileTracingIncludes,
      # finner en katalog og panikker: TurbopackInternalError «Is a directory
      # (os error 21)». Gjelder alle av 16.3.0-16.3.5; 16.2.12 bygger. Rettet
      # oppstrøms i vercel/next.js#97507, som lander i 16.4: vedlikeholderen
      # som lukket vercel/next.js#96626 bekreftet at reproen feiler på 16.3.4
      # og lykkes fra 16.4.0-canary.0. Løft når 16.4 er ute som stabil, og se
      # navikt/copilot#852 for hele sporet.
      - dependency-name: "next"
        versions: [">=16.3"]
    open-pull-requests-limit: 5

  # copilot-metrics (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/copilot-metrics"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      copilot-metrics-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # mcp-onboarding (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/mcp-onboarding"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      mcp-onboarding-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # mcp-registry (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/mcp-registry"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      mcp-registry-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # nav-pilot installer (Go)
  - package-ecosystem: "gomod"
    directory: "/cli/nav-pilot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      nav-pilot-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5
