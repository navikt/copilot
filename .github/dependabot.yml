        patterns:
          - "*"
    open-pull-requests-limit: 5

  # generate-retired (Go)
  - package-ecosystem: "gomod"
    directory: "/scripts/generate-retired"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      generate-retired-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Frozen benchmark fixture: run results record its fixture hash, so bumps
  # would invalidate the baselines. Limit 0 turns off version updates here.
  - package-ecosystem: "npm"
    directory: "/benchmark/realistic/typescript/incident/workspace"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # Security updates ignore the limit above, so ignore every dependency too.
    ignore:
      - dependency-name: "*"
