version: 2
registries:
  # Pakker fra GitHub Packages (@nais/apm fra #2026) krever token også for
  # offentlige pakker. READER_TOKEN er navikt-org-hemmeligheten, samme
  # mønster som navikt/aksel; den må finnes som Dependabot-hemmelighet.
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@nais"
    token: ${{ secrets.READER_TOKEN }}
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      github-actions:
        patterns:
          - "*"
        # Kompilerte lock-filer skal ikke SHA-patches av Dependabot — de
        # genereres fra kilden (f.eks. `gh aw compile`). Da #428 og #433
        # oppdaterte news-excerpts.lock.yml direkte, kom SHA-ene ut av takt
        # med filas eget manifest og workflowen sluttet å kjøre (#443).
        exclude-patterns:
          - "*.lock.yml"
    open-pull-requests-limit: 5

  # my-copilot (Next.js)
  - package-ecosystem: "npm"
    directory: "/apps/my-copilot"
    registries:
      - npm-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      nextjs-core:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      navikt:
        patterns:
          - "@navikt/*"
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@navikt/*"
    ignore:
      # TypeScript 7 er holdt tilbake på 6.x. eslint-config-next trekker inn
      # typescript-eslint, som per 8.70.0 (siste) sier `typescript: ">=4.8.4
      # <6.1.0"` og avbryter med «typescript-eslint does not support TS 7.0».
      # Da faller `pnpm lint` på første fil. `tsc --noEmit` er grønn på TS 7 —
      # det er kun linten som stopper. Løft dette når typescript-eslint
      # støtter TS >= 7 (github.com/typescript-eslint/typescript-eslint#10940)
      # og eslint-config-next har fått den versjonen.
      - dependency-name: "typescript"
        versions: [">=7"]
    open-pull-requests-limit: 5

  # copilot-api (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/copilot-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      copilot-api-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # copilot-adoption (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/copilot-adoption"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      copilot-adoption-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # copilot-cli (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/copilot-cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    reviewers:
      - "navikt/copilot"
    groups:
      copilot-cli-go:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # copilot-survey (Go)
  - package-ecosystem: "gomod"
    directory: "/apps/copilot-survey"
