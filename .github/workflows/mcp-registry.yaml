name: mcp-registry build-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-registry/**'
      - '.github/workflows/mcp-registry.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mcp-registry/**'
      - '.github/workflows/mcp-registry.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  # Read public npm packages (@nais/apm) from GitHub Packages.
  packages: read

jobs:
  build:
    uses: ./.github/workflows/mise-build-deploy-nais.yaml
    with:
      working-directory: apps/mcp-registry
      mise-setup-tasks: '["install"]'
      mise-tasks: '["lint", "check"]'
      deploys-to-nais: true
      deploy-pr-to-dev: true
      nais-team: copilot
      nais-clusters: '["dev-gcp", "prod-gcp"]'

  # Runs the Postgres-backed store tests, which skip without TEST_DATABASE_URL.
  db-test:
    name: Postgres tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/mcp-registry
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
          working_directory: apps/mcp-registry
      - run: go test -count=1 -run 'TestStore_RealPostgres' -v ./...
