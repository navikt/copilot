name: fleet-gateway build-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/fleet-gateway/**'
      - '.github/workflows/fleet-gateway.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/fleet-gateway/**'
      - '.github/workflows/fleet-gateway.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # A failing Postgres test stops the deploy.
    needs: db-test
    if: ${{ !cancelled() && needs.db-test.result == 'success' }}
    permissions:
      contents: read
      # Read ci.yaml runs: deploy waits for a green ci-ok on this commit.
      actions: read
      id-token: write
      # Read public npm packages (@nais/apm) from GitHub Packages.
      packages: read
    uses: ./.github/workflows/mise-build-deploy-nais.yaml
    with:
      working-directory: apps/fleet-gateway
      mise-setup-tasks: '["install"]'
      mise-tasks: '["lint", "check"]'
      deploys-to-nais: true
      deploy-pr-to-dev: true
      check-on-pr: true
      nais-team: copilot
      nais-clusters: '["dev-gcp", "prod-gcp"]'

  echo:
    name: fleet-echo
    # A failing Postgres test stops the deploy.
    needs: db-test
    if: ${{ !cancelled() && needs.db-test.result == 'success' }}
    permissions:
      contents: read
      # Read ci.yaml runs: deploy waits for a green ci-ok on this commit.
      actions: read
      id-token: write
      # Read public npm packages (@nais/apm) from GitHub Packages.
      packages: read
    uses: ./.github/workflows/mise-build-deploy-nais.yaml
    with:
      working-directory: apps/fleet-gateway/echo
      mise-setup-tasks: '["install"]'
      mise-tasks: '["lint", "check"]'
      deploys-to-nais: true
      deploy-pr-to-dev: true
      check-on-pr: true
      nais-team: copilot
      nais-clusters: '["dev-gcp"]'

  # Runs the Postgres-backed store tests, which skip without FGW_TEST_PG_URL.
  db-test:
    name: Postgres tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/fleet-gateway
    env:
      FGW_TEST_PG_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      # Makes the Postgres tests fail instead of skip if the URL goes missing.
      FGW_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # ratchet:jdx/mise-action@v5.2.9
        with:
          experimental: true
          working_directory: apps/fleet-gateway
      - run: go test -count=1 -v ./...
