name: nav-pilot CI

on:
  push:
    branches: [main]
    paths:
      - 'cli/nav-pilot/**'
      - 'apps/copilot-survey/surveys/schema.json'
      - 'scripts/install.sh'
      - 'scripts/*.bats'
      - '.github/workflows/copilot-customization-sync.yml'
      - 'skills/**'
      - 'agents/**'
      - '.nav-pilot/**'
      - 'instructions/**'
      - 'prompts/**'
      - 'hooks/**'
      - '.github/hooks/**'
      - '.github/workflows/nav-pilot-ci.yaml'
      - 'dashboards/nav-pilot-*.json'
      - 'scripts/build-local-dashboard.py'
      - 'scripts/nav-pilot-golden.sh'
      - 'scripts/benchmark-*.py'
      - 'docs/golden-baselines/**'
  pull_request:
    branches: [main]
    paths:
      - 'cli/nav-pilot/**'
      - 'apps/copilot-survey/surveys/schema.json'
      - 'scripts/install.sh'
      - 'scripts/*.bats'
      - '.github/workflows/copilot-customization-sync.yml'
      - 'skills/**'
      - 'agents/**'
      - '.nav-pilot/**'
      - 'instructions/**'
      - 'prompts/**'
      - 'hooks/**'
      - '.github/hooks/**'
      - '.github/workflows/nav-pilot-ci.yaml'
      - 'dashboards/nav-pilot-*.json'
      - 'scripts/build-local-dashboard.py'
      - 'scripts/nav-pilot-golden.sh'
      - 'scripts/benchmark-*.py'
      - 'docs/golden-baselines/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/nav-pilot/go.mod
          cache: true

      - name: Build
        run: cd cli/nav-pilot && go build -o nav-pilot .

      # pi is the one client nav-pilot hands artifacts to by flag rather than by
      # config file, so a flag rename upstream would break a user's session with
      # nothing here to catch it. TestPiAcceptsTheFlagsWeSend runs the real
      # binary and skips when it is absent; installing it makes that check real.
      # It does not enable a launch: that needs cplt and a credential.
      - name: Install pi (for flag verification)
        continue-on-error: true
        run: npm i -g @earendil-works/pi-coding-agent && pi --version || true

      - name: Test and Coverage
        run: |
          cd cli/nav-pilot && go test -race -v -coverpkg=./... -coverprofile=cover.out -skip TestLaunchBudget ./...
          go tool cover -func=cover.out
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')
          floor=65
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t + 0 < f + 0) {
              print "ERROR: coverage " t "% is below floor " f "%"
              exit 1
            }
            print "Coverage " t "% meets floor " f "%"
          }'
          rm -f cover.out

      # Alone, without -race: it times nav-pilot, and the other packages'
      # tests running beside it would time the runner instead.
      - name: Launch budget
        run: cd cli/nav-pilot && go test ./e2e -run TestLaunchBudget -count=1 -v

      - name: Vet
        run: cd cli/nav-pilot && go vet ./...

      # The preToolUse gates nav-pilot installs. Each one tests itself through
      # real stdin and stdout; .github/hooks/ is this repo's own install of
      # them and must not drift from the source (mise run hooks:test).
      - name: Hook selftests
        run: |
          for f in hooks/*.py; do
            python3 "$f" --selftest
            diff -q "$f" ".github/hooks/$(basename "$f")"
          done

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          cd cli/nav-pilot && staticcheck ./...

      - name: Local dashboard is generated
        run: python3 scripts/build-local-dashboard.py --check

      # summary.json feeds ki-utvikling.nav.no/modeller; the checks are the
      # benchmark's own, each with a failing control (mise run benchmark:check).
      - name: Benchmark summary is current
        run: |
          python3 scripts/benchmark-sjekk.py --selftest
          python3 scripts/benchmark-summary.py --selftest
          python3 scripts/benchmark-summary.py --check

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck scripts/install.sh skills/*/*.sh

  bats:
    name: Unit Test install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # ratchet:jdx/mise-action@v5.0.1
        with:
          experimental: true

      - name: Run BATS
        run: mise exec -- bats scripts/install.bats scripts/sync-pr-body.bats scripts/skill-selvutlosning-probe.bats scripts/nav-pilot-golden.bats scripts/obs-query.bats

  e2e-install:
    name: E2E test install.sh
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ["ubuntu:latest", "alpine:latest"]
    container: ${{ matrix.container }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup prerequisites (Ubuntu)
        if: contains(matrix.container, 'ubuntu')
        run: apt-get update && apt-get install -y curl

      - name: Setup prerequisites (Alpine)
        if: contains(matrix.container, 'alpine')
        run: apk add --no-cache bash curl coreutils git

      - name: Run install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh --dir /usr/local/bin

      - name: Verify installation
        run: |
          /usr/local/bin/nav-pilot version
          # Ensure scripts exited 0
