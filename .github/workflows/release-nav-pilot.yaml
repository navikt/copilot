name: Release nav-pilot

on:
  workflow_run:
    workflows: ["nav-pilot CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm'
        required: true

concurrency:
  group: nav-pilot-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'release') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit_sha: ${{ steps.v.outputs.commit_sha }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      tag: ${{ steps.v.outputs.tag }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - id: v
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          DATE=$(date -u +%Y.%m.%d)
          TIME=$(date -u +%H%M%S)
          VERSION="${DATE}-${TIME}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=nav-pilot/${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=nav-pilot ${DATE} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/nav-pilot/go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd cli/nav-pilot
          go build \
            -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${{ needs.prepare.outputs.commit_sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../../nav-pilot-${{ matrix.goos }}-${{ matrix.goarch }} \
            .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: nav-pilot-${{ matrix.goos }}-${{ matrix.goarch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nav-pilot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nav-pilot-${{ matrix.goos }}-${{ matrix.goarch }}

  deb:
    name: Build .deb (${{ matrix.arch }})
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nav-pilot-linux-${{ matrix.arch }}

      # dpkg-deb is on the runner, so a one-binary package needs no packaging
      # tool. The version carries a hyphen, which dpkg reads as the upstream /
      # revision split: 2026.09.12-225921-bb3fbb6 is upstream 2026.09.12-225921
      # at revision bb3fbb6. Both halves sort the way apt expects.
      - name: Build package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          root="pkg/nav-pilot"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/doc/nav-pilot"
          install -m 0755 "nav-pilot-linux-${ARCH}" "$root/usr/bin/nav-pilot"
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: nav-pilot
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: Nav <navikt@nav.no>
          Section: devel
          Priority: optional
          Homepage: https://github.com/navikt/copilot
          Description: Nav's institutional AI developer toolkit installer
           nav-pilot installs Nav's agents, skills and instructions into a repo
           or a user profile, and launches a coding agent against them.
          CONTROL
          sed -i 's/^          //' "$root/DEBIAN/control"
          cp LICENSE "$root/usr/share/doc/nav-pilot/copyright"
          dpkg-deb --root-owner-group --build "$root" "nav-pilot_${VERSION}_${ARCH}.deb"
          dpkg-deb --info "nav-pilot_${VERSION}_${ARCH}.deb"
          dpkg-deb --contents "nav-pilot_${VERSION}_${ARCH}.deb"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nav-pilot-deb-${{ matrix.arch }}
          path: nav-pilot_*.deb

  release:
    name: Publish release
    needs: [prepare, build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum nav-pilot-* nav-pilot_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cli/nav-pilot/cliff.toml
          args: --unreleased --tag ${{ needs.prepare.outputs.tag }} --include-path "cli/nav-pilot/*" --include-path "skills/*" --include-path "agents/*" --include-path ".nav-pilot/*" --include-path "scripts/install.sh"

      - name: Build release body
        id: notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          {
            echo "body<<RELEASE_EOF"
            printf '%s\n' \
              "## nav-pilot" \
              "" \
              "Nav's institutional AI developer toolkit installer." \
              "" \
              "### Installation" \
              "" \
              '```bash' \
              "brew install navikt/tap/nav-pilot" \
              '```' \
              "" \
              "Or with mise, or apt on Debian/Ubuntu:" \
              "" \
              '```bash' \
              "mise use -g 'github:navikt/copilot[exe=nav-pilot,version_prefix=nav-pilot/]@${{ needs.prepare.outputs.version }}'" \
              "sudo apt install ./nav-pilot_${{ needs.prepare.outputs.version }}_amd64.deb" \
              '```' \
              "" \
              "Or on Linux / CI:" \
              "" \
              '```bash' \
              "curl -fsSL https://raw.githubusercontent.com/navikt/copilot/main/scripts/install.sh | bash" \
              '```' \
              ""
            echo "$CHANGELOG"
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: ${{ needs.prepare.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/nav-pilot-*
            artifacts/nav-pilot_*.deb
            artifacts/SHA256SUMS

