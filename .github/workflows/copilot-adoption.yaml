name: copilot-adoption build-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/copilot-adoption/**'
      - '.github/workflows/copilot-adoption.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/copilot-adoption/**'
      - '.github/workflows/copilot-adoption.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      # Read ci.yaml runs: deploy waits for a green ci-ok on this commit.
      actions: read
      id-token: write
      # Read public npm packages (@nais/apm) from GitHub Packages.
      packages: read
    uses: ./.github/workflows/mise-build-deploy-nais.yaml
    with:
      working-directory: apps/copilot-adoption
      mise-setup-tasks: '["install"]'
      mise-tasks: '["lint", "check"]'
      deploys-to-nais: true
      deploy-pr-to-dev: true
      nais-resource: '.nais/naisjob.yaml'
      nais-team: copilot
      nais-clusters: '["dev-gcp", "prod-gcp"]'
