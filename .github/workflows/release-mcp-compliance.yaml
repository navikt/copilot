name: Release mcp-compliance

# Every push to main that touches cli/mcp-compliance cuts a release, as
# release-nav-pilot.yaml does for nav-pilot. The code was already checked by
# `ci` in the merge queue. The tag cli/mcp-compliance/vX.Y.Z is both the Go
# module version (so `go install ...@latest` resolves it) and the release; the
# workflow creates it, and a tag ruleset keeps anyone else from doing so.
# navikt/homebrew-tap polls for new releases and updates the formula, as it
# does for nav-pilot.
#
# Version bump since the last tag, from Conventional Commit subjects of the
# commits touching cli/mcp-compliance: a breaking change (`!:` or
# BREAKING CHANGE) or `feat` bumps the minor while below v1, otherwise patch.
# No tag yet gives v0.1.0.
on:
  push:
    branches: [main]
    paths: ["cli/mcp-compliance/**"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm'
        required: true

concurrency:
  group: mcp-compliance-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version
    if: >
      github.event_name == 'push' ||
      (github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit_sha: ${{ steps.v.outputs.commit_sha }}
      tag: ${{ steps.v.outputs.tag }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(scripts/mcp-compliance-next-version.sh "$COMMIT_SHA")
          {
            echo "version=${VERSION}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "tag=cli/mcp-compliance/${VERSION}"
            echo "title=mcp-compliance ${VERSION}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/mcp-compliance/go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd cli/mcp-compliance
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${VERSION}" -o "../../mcp-compliance-${GOOS}-${GOARCH}" .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: mcp-compliance-${{ matrix.goos }}-${{ matrix.goarch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-compliance-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mcp-compliance-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum mcp-compliance-* > SHA256SUMS
          cat SHA256SUMS

      - name: Check release assets
        run: ls artifacts/mcp-compliance-{darwin,linux}-{amd64,arm64} artifacts/SHA256SUMS

      # publish-release.sh creates the tag when it publishes. SWEEP_PREFIX keeps
      # the leftover-draft sweep off nav-pilot/ drafts, and LATEST=false keeps
      # the Latest badge on nav-pilot.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.commit_sha }}
          TITLE: ${{ needs.prepare.outputs.title }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' \
            "## mcp-compliance ${VERSION}" \
            "" \
            "Checks an MCP server behind fleet-gateway against MCP 2026-07-28 and Nav's auth rules." \
            "" \
            '```bash' \
            "brew install navikt/tap/mcp-compliance" \
            "go install github.com/navikt/copilot/cli/mcp-compliance@${VERSION}" \
            '```' \
            "" \
            "See cli/mcp-compliance/README.md." > "$RUNNER_TEMP/notes.md"
          export SWEEP_PREFIX=cli/mcp-compliance/ LATEST=false
          exec scripts/publish-release.sh "$TAG" "$SHA" "$TITLE" "$RUNNER_TEMP/notes.md" artifacts
