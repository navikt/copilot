name: model pricing sync

# Prices are third-party data: GitHub changes them on their schedule, not ours.
# So this is not a PR gate. A gate would turn someone else's price change into a
# red build on main, and the person who broke it would be whoever pushed next.
#
# Instead: check daily, and when the numbers have moved, open a PR with the
# regenerated file so a human sees what changed and why it matters. The task
# already exists as `mise run pricing:sync`; it just never ran anywhere.
#
# This matters more than it looks. Nav's model choices are argued from these
# numbers in docs/modellvalg.md. Nothing watched the generated file, so it
# drifted from GitHub's published prices, and a decision document went on
# arguing from numbers that had since moved. A stale price does not announce
# itself: the document still reads as if it were current.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check model pricing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v6.0.0
        with:
          node-version: 22

      - name: Open a PR when prices moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=apps/my-copilot/src/lib/model-pricing.ts

          # The generator stamps today's date into the file on every run, so an
          # unchanged price list still produces a diff, and we used to open a PR
          # to close every morning. `--check` compares with both timestamps
          # normalised out and writes nothing, so ask it whether anything real
          # moved before regenerating.
          #
          # It has three answers and they are not interchangeable. 0: only the
          # date would change. 2: a price actually moved. 1: the check never got
          # an answer, because the fetch failed, the parse floor tripped, or a
          # model came back unpriced. Reading that 1 as drift is how the
          # timestamp-only PR came back: the check dies, the regeneration's own
          # fetch then succeeds with unchanged prices, and the only thing left in
          # the diff is today's date. So an error stops the run instead, loudly.
          #
          # GH_TOKEN is set for the whole step because the `gh` calls below need
          # it. The generator does not, so it is cleared for these invocations
          # rather than handed a credential it has no use for.
          check_pricing() {
            local rc=0
            GH_TOKEN='' node scripts/sync-model-pricing.mjs --check || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              echo "Pricing check failed (exit $rc). Not treating that as a price change." >&2
              exit 1
            fi
            return "$rc"
          }

          if check_pricing; then
            echo "Only the timestamp would move; no price change."
            exit 0
          fi

          GH_TOKEN='' node scripts/sync-model-pricing.mjs

          echo "Pricing moved:"
          git diff --stat -- "$FILE"

          BRANCH=chore/model-pricing-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `gh pr view` resolves merged and closed PRs too, so it would report a
          # PR forever once the first one merged and this would never open another.
          # Ask for open ones only.
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq length)

          # Park the regenerated file: switching branches needs a clean tree.
          TMP="${RUNNER_TEMP:-/tmp}/model-pricing.ts"
          cp "$FILE" "$TMP"
          git checkout -- "$FILE"

          if [ "$OPEN" -gt 0 ]; then
            # The PR body asks a human to check docs/modellvalg.md against this
            # branch, so a human may have pushed a correction onto it. Build on
            # the branch tip and push without force, or that work disappears at
            # the next cron. A rejected push means someone pushed mid-run;
            # tomorrow's run picks it up.
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD

            # The check above ran against main, and main stays stale for as long
            # as this PR is open, so it reports drift every morning until the PR
            # merges. Ask the same question again now that the branch's own file
            # is the one on disk: exit 0 here means the branch already matches
            # the page apart from timestamps, so the only thing a push would add
            # is today's date. That is the commit this workflow exists to avoid.
            if check_pricing; then
              echo "The open PR already carries these prices. Nothing to push."
              exit 0
            fi
            PUSH_OPTS=""
          else
            git checkout -B "$BRANCH"
            PUSH_OPTS="--force"
          fi

          cp "$TMP" "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "The branch already carries these prices. Nothing to push."
            exit 0
          fi

          git add "$FILE"
          git commit -m "chore(pricing): sync model pricing from GitHub docs

          Regenerated by the daily pricing check. Review the diff before merging:
          a price move can invalidate the reasoning in docs/modellvalg.md, which
          argues Nav's model choices from these numbers."
          git push $PUSH_OPTS origin "$BRANCH"

          if [ "$OPEN" -eq 0 ]; then
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(pricing): model prices have changed" \
              --body "GitHub's published Copilot model prices no longer match \`apps/my-copilot/src/lib/model-pricing.ts\`.

          The regenerated file is on this branch. Check the diff against \`docs/modellvalg.md\`: that document argues Nav's model choices from these numbers, so a price that moved can leave a stated conclusion resting on a number that no longer exists.

          Push corrections straight onto this branch. The daily check builds on what is here rather than replacing it.

          Generated by \`.github/workflows/pricing-sync.yaml\`."
          fi
