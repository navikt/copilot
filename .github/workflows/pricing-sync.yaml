name: model pricing sync

# Prices are third-party data: GitHub changes them on their schedule, not ours.
# So this is not a PR gate. A gate would turn someone else's price change into a
# red build on main, and the person who broke it would be whoever pushed next.
#
# Instead: check daily, and when the numbers have moved, open a PR with the
# regenerated file so a human sees what changed and why it matters. The task
# already exists as `mise run pricing:sync`; it just never ran anywhere.
#
# This matters more than it looks. Nav's model choices are argued from these
# numbers in docs/modellvalg.md, and when this drifted, Sol was listed at
# $5/$30 when it was $2/$10. A decision doc rejected a model on a price that
# was wrong by a factor of three.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check model pricing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v6.0.0
        with:
          node-version: 22

      - name: Regenerate pricing data
        run: node scripts/sync-model-pricing.mjs

      - name: Open a PR when prices moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=apps/my-copilot/src/lib/model-pricing.ts
          if git diff --quiet -- "$FILE"; then
            echo "Pricing unchanged."
            exit 0
          fi

          echo "Pricing moved:"
          git diff --stat -- "$FILE"

          BRANCH=chore/model-pricing-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$FILE"
          git commit -m "chore(pricing): sync model pricing from GitHub docs

Regenerated by the daily pricing check. Review the diff before merging:
a price move can invalidate the reasoning in docs/modellvalg.md, which
argues Nav's model choices from these numbers."
          git push -f origin "$BRANCH"

          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(pricing): model prices have changed" \
              --body "GitHub's published Copilot model prices no longer match \`apps/my-copilot/src/lib/model-pricing.ts\`.

The regenerated file is on this branch. Check the diff against \`docs/modellvalg.md\`: that document argues Nav's model choices from these numbers, and a price move can invalidate its reasoning. When this check first ran, Sol was listed at \$5/\$30 against an actual \$2/\$10, and a documented rejection of GPT-5.6 Terra rested on an input price that was wrong.

Generated by \`.github/workflows/pricing-sync.yaml\`."
          fi
