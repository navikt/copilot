# Reusable workflow for projects using mise
# This workflow is language-agnostic and expects the following tasks to be defined in mise.toml:
#   - version: Generate version string (e.g., YYYYMMDD-gitsha)
#   - Individual tasks: Configurable quality checks (e.g., tidy-check, fmt-check, lint, vet, check, test-race for Go projects)
#   - build: Build task for your project
# Projects can customize behavior through mise.toml without modifying this workflow

name: Build and Deploy with mise

on:
  workflow_call:
    inputs:
      mise-task-version:
        description: 'mise task name for version generation'
        required: false
        type: string
        default: 'version'
      mise-setup-tasks:
        description: 'JSON array of mise setup tasks to run sequentially before other tasks (e.g., ["install:ts", "install:go"])'
        required: false
        type: string
        default: '[]'
      mise-tasks:
        description: 'JSON array of mise tasks to run in parallel (e.g., ["tidy-check", "fmt-check", "lint", "vet", "check", "test-race"])'
        required: false
        type: string
        default: '["tidy-check", "fmt-check", "lint", "vet", "check", "test-race"]'
      mise-task-build:
        description: 'mise task name for building'
        required: false
        type: string
        default: 'build'
      builds-docker:
        description: 'Build and push Docker image'
        required: false
        type: boolean
        default: true
      dockerfile-path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      docker-context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      deploys-to-nais:
        description: 'Deploy to Nais clusters'
        required: false
        type: boolean
        default: false
      nais-resource:
        description: 'Path to Nais application manifest'
        required: false
        type: string
        default: '.nais/app.yaml'
      nais-vars:
        description: 'Path to Nais environment variables. Use {cluster} placeholder for multi-cluster (e.g., .nais/{cluster}.yaml)'
        required: false
        type: string
        default: '.nais/{cluster}.yaml'
      nais-clusters:
        description: 'JSON array of Nais clusters to deploy to'
        required: false
        type: string
        default: '["dev-gcp"]'
      nais-team:
        description: 'Nais team name'
        required: false
        type: string
        default: 'nais'
      deploy-pr-to-dev:
        description: 'Deploy pull requests to dev environment'
        required: false
        type: boolean
        default: false
      check-on-pr:
        description: 'Run the Check job on pull requests and make the Docker build and PR deploy wait for it. Default false: ci.yaml already checks PRs.'
        required: false
        type: boolean
        default: false
      artifact-registry:
        description: 'Docker registry for artifacts'
        required: false
        type: string
        default: 'europe-north1-docker.pkg.dev'
      artifact-repo:
        description: 'Docker repository name'
        required: false
        type: string
        default: 'nais-io/nais/images'
      runner-size:
        description: 'GitHub Actions runner size'
        required: false
        type: string
        default: 'ubuntu-latest'
      runner-size-docker:
        description: 'GitHub Actions runner size for Docker builds'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory for monorepo support'
        required: false
        type: string
        default: '.'
    outputs:
      version:
        description: 'Generated version string'
        value: ${{ jobs.meta.outputs.version }}
      name:
        description: 'Repository name'
        value: ${{ jobs.meta.outputs.name }}
      image:
        description: 'Full Docker image reference with tag'
        value: ${{ jobs.docker.outputs.image }}

jobs:
  meta:
    name: Metadata
    permissions:
      contents: read
    runs-on: ${{ inputs.runner-size }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # ratchet:jdx/mise-action@v5.2.8
        with:
          experimental: true
      - id: version
        env:
          # Not MISE_TASK_VERSION: mise reads MISE_<TOOL>_VERSION as a tool pin,
          # so that name pinned the go-task tool to version "version".
          VERSION_TASK: ${{ inputs.mise-task-version }}
        run: |
          version=$(mise run "$VERSION_TASK")
          test -n "$version"
          echo "version=$version" >> "${GITHUB_OUTPUT}"
      - id: name
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          WORKING_DIR: ${{ inputs.working-directory }}
        run: |
          # Extract app name from working directory (e.g., apps/mcp-onboarding -> mcp-onboarding)
          if [ "$WORKING_DIR" != "." ]; then
            APP_NAME=$(basename "$WORKING_DIR")
          else
            APP_NAME="$REPO_NAME"
          fi
          echo "name=$APP_NAME" >> ${GITHUB_OUTPUT}

  setup:
    name: Setup
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    if: ${{ inputs.mise-setup-tasks != '[]' }}
    runs-on: ${{ inputs.runner-size }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: hashFiles('**/pnpm-lock.yaml') != ''
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # ratchet:jdx/mise-action@v5.2.8
        with:
          experimental: true
      - name: Configure GitHub Packages auth
        run: |
          umask 077
          printf '%s\n' "//npm.pkg.github.com/:_authToken=\${GITHUB_PACKAGES_TOKEN}" > "$RUNNER_TEMP/github-packages.npmrc"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$RUNNER_TEMP/github-packages.npmrc" >> "$GITHUB_ENV"
      - name: Run setup tasks
        env:
          MISE_SETUP_TASKS: ${{ inputs.mise-setup-tasks }}
        run: |
          echo "$MISE_SETUP_TASKS" | jq -r '.[]' | while read task; do
            echo "Running setup task: $task"
            mise run "$task"
          done

  lint:
    name: Check
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    needs: [setup]
    # Runs only on pull requests with check-on-pr, for apps whose PR deploy
    # must wait for tests. ci.yaml runs the same install/lint/check per app
    # as the required `ci-ok` gate, and the merge queue tested the exact
    # commit that lands on main, so other events use the ci-ok job below.
    if: ${{ github.event_name == 'pull_request' && inputs.check-on-pr && always() && (needs.setup.result == 'success' || needs.setup.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(inputs.mise-tasks) }}
    runs-on: ${{ inputs.runner-size }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: hashFiles('**/pnpm-lock.yaml') != ''
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # ratchet:jdx/mise-action@v5.2.8
        with:
          experimental: true
      - name: Configure GitHub Packages auth
        run: |
          umask 077
          printf '%s\n' "//npm.pkg.github.com/:_authToken=\${GITHUB_PACKAGES_TOKEN}" > "$RUNNER_TEMP/github-packages.npmrc"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$RUNNER_TEMP/github-packages.npmrc" >> "$GITHUB_ENV"
      - name: Run setup tasks
        if: ${{ inputs.mise-setup-tasks != '[]' }}
        env:
          MISE_SETUP_TASKS: ${{ inputs.mise-setup-tasks }}
        run: |
          echo "$MISE_SETUP_TASKS" | jq -r '.[]' | while read task; do
            echo "Running setup task: $task"
            mise run "$task"
          done
      - name: Run ${{ matrix.task }}
        env:
          MISE_TASK: ${{ matrix.task }}
        run: mise run "$MISE_TASK"

  ci-ok:
    name: Wait for ci-ok
    # On push to main, reuse the merge queue's result instead of rerunning
    # lint/check: wait for a ci.yaml run on this exact SHA whose ci-ok job
    # succeeded. No green ci-ok, no image and no deploy. Skipped on
    # workflow_dispatch so manual dev deploys from branches keep working.
    if: ${{ github.event_name == 'push' }}
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for a green ci-ok on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          while :; do
            pending=0
            runs=$(gh api "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${SHA}&per_page=20" \
              --jq '.workflow_runs[] | "\(.id) \(.status)"')
            while read -r run_id status; do
              [ -n "$run_id" ] || continue
              if [ "$status" != "completed" ]; then pending=1; continue; fi
              ok=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "ci-ok" and .conclusion == "success")] | length == 1')
              if [ "$ok" = "true" ]; then
                echo "Reusing green ci-ok from run ${run_id} for SHA ${SHA}"
                exit 0
              fi
            done <<< "$runs"
            if [ "$pending" = 0 ]; then
              echo "::error::no ci.yaml run with a green ci-ok for ${SHA}; rerun ci.yaml (workflow_dispatch) on this commit"
              exit 1
            fi
            echo "ci.yaml still running for ${SHA}; waiting"
            sleep 30
          done

  build:
    name: Build
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    needs: [setup]
    if: ${{ always() && (needs.setup.result == 'success' || needs.setup.result == 'skipped') }}
    runs-on: ${{ inputs.runner-size }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: hashFiles('**/pnpm-lock.yaml') != ''
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # ratchet:jdx/mise-action@v5.2.8
        with:
          experimental: true
      - name: Configure GitHub Packages auth
        run: |
          umask 077
          printf '%s\n' "//npm.pkg.github.com/:_authToken=\${GITHUB_PACKAGES_TOKEN}" > "$RUNNER_TEMP/github-packages.npmrc"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$RUNNER_TEMP/github-packages.npmrc" >> "$GITHUB_ENV"
      - name: Run setup tasks
        if: ${{ inputs.mise-setup-tasks != '[]' }}
        env:
          MISE_SETUP_TASKS: ${{ inputs.mise-setup-tasks }}
        run: |
          echo "$MISE_SETUP_TASKS" | jq -r '.[]' | while read task; do
            echo "Running setup task: $task"
            mise run "$task"
          done
      - env:
          MISE_TASK_BUILD: ${{ inputs.mise-task-build }}
        run: mise run "$MISE_TASK_BUILD"

  docker:
    name: Build Docker Image
    # !cancelled() plus explicit results: on push ci-ok must have succeeded
    # (skipped on PRs and workflow_dispatch); on PRs lint must have succeeded when check-on-pr.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.build.result == 'success' && (github.event_name != 'push' || needs.ci-ok.result == 'success') && (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && !(github.event_name == 'pull_request' && inputs.check-on-pr))) && inputs.builds-docker && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on: ${{ inputs.runner-size-docker }}
    needs: [meta, lint, ci-ok, build]
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      telemetry: ${{ steps.docker-push.outputs.telemetry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: ${{ inputs.nais-team }}
          tag: ${{ needs.meta.outputs.version }}
          image_suffix: ${{ needs.meta.outputs.name }}
          push_image: ${{ github.ref == 'refs/heads/main' || (inputs.deploy-pr-to-dev && github.event_name == 'pull_request') }}
          dockerfile: ${{ inputs.working-directory != '.' && format('{0}/{1}', inputs.working-directory, inputs.dockerfile-path) || inputs.dockerfile-path }}
          docker_context: ${{ inputs.working-directory != '.' && format('{0}/{1}', inputs.working-directory, inputs.docker-context) || inputs.docker-context }}
          build_args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
          # BuildKit secret, never a layer: lets pnpm read GitHub Packages.
          build_secrets: |
            npmrc=//npm.pkg.github.com/:_authToken=${{ github.token }}
          cache_from: type=gha
          cache_to: type=gha,mode=max

  deploy:
    name: Deploy to Nais
    if: ${{ inputs.deploys-to-nais && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: [meta, docker]
    strategy:
      matrix:
        cluster: ${{ fromJson(inputs.nais-clusters) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Resolve paths
        id: paths
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
          Nais_RESOURCE: ${{ inputs.nais-resource }}
          Nais_VARS_PATTERN: ${{ inputs.nais-vars }}
          CLUSTER: ${{ matrix.cluster }}
        run: |
          if [ "$WORKING_DIR" != "." ]; then
            IFS=',' read -ra RESOURCES <<< "$Nais_RESOURCE"
            RESOURCE_PATH=""
            for resource in "${RESOURCES[@]}"; do
              RESOURCE_PATH="${RESOURCE_PATH:+$RESOURCE_PATH,}$WORKING_DIR/$resource"
            done
            VARS_PATTERN="$WORKING_DIR/$Nais_VARS_PATTERN"
          else
            RESOURCE_PATH="$Nais_RESOURCE"
            VARS_PATTERN="$Nais_VARS_PATTERN"
          fi
          VARS_PATH="${VARS_PATTERN//\{cluster\}/$CLUSTER}"
          echo "resource=$RESOURCE_PATH" >> "$GITHUB_OUTPUT"
          echo "vars=$VARS_PATH" >> "$GITHUB_OUTPUT"
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: ${{ matrix.cluster }}
          TEAM: ${{ inputs.nais-team }}
          RESOURCE: ${{ steps.paths.outputs.resource }}
          VARS: ${{ steps.paths.outputs.vars }}
          IMAGE: ${{ needs.docker.outputs.image }}
          TELEMETRY: ${{ needs.docker.outputs.telemetry }}

  deploy-pr:
    name: Deploy PR to dev
    # !cancelled(): the skipped lint job upstream would otherwise skip this too.
    # With check-on-pr, lint must have succeeded.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.docker.result == 'success' && (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && !inputs.check-on-pr)) && inputs.deploy-pr-to-dev && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [meta, lint, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Resolve paths
        id: paths
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
          Nais_RESOURCE: ${{ inputs.nais-resource }}
        run: |
          if [ "$WORKING_DIR" != "." ]; then
            IFS=',' read -ra RESOURCES <<< "$Nais_RESOURCE"
            RESOURCE_PATH=""
            for resource in "${RESOURCES[@]}"; do
              RESOURCE_PATH="${RESOURCE_PATH:+$RESOURCE_PATH,}$WORKING_DIR/$resource"
            done
            VARS_PATH="$WORKING_DIR/.nais/dev-gcp.yaml"
          else
            RESOURCE_PATH="$Nais_RESOURCE"
            VARS_PATH=".nais/dev-gcp.yaml"
          fi
          echo "resource=$RESOURCE_PATH" >> "$GITHUB_OUTPUT"
          echo "vars=$VARS_PATH" >> "$GITHUB_OUTPUT"
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          TEAM: ${{ inputs.nais-team }}
          RESOURCE: ${{ steps.paths.outputs.resource }}
          VARS: ${{ steps.paths.outputs.vars }}
          IMAGE: ${{ needs.docker.outputs.image }}
          TELEMETRY: ${{ needs.docker.outputs.telemetry }}
