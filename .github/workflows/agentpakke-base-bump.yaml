name: Agentpakke base bump

# Reusable workflow for an agentpakke that reuses another (#1368).
#
# A pakke that reuses another pins the base in .nav-pilot/agentpakke.lock.json,
# and every install and sync resolves the base at exactly that revision. Nothing
# moves the pin. nais/pilot sat on a navikt/copilot revision for weeks, and its
# users ran agents whose frontmatter model pins had since been replaced; a model
# pin beats --model, so the stale pin decided which model ran.
#
# This workflow keeps the pin moving without taking the review away: it runs
# `nav-pilot pakke bump-base`, which moves the pin onto the base's newest stable
# release (or its default branch when the base publishes none) and prints a
# summary of the agents and model pins that changed. The pull request carries
# that summary, and the owner merges it. The logic lives in nav-pilot, so an
# owner can run the same command locally and get the same answer.
#
# Usage: create .github/workflows/agentpakke-base-bump.yaml in the pakke repo:
#
#   name: Agentpakke base bump
#   on:
#     schedule:
#       - cron: '0 6 * * 1'  # Mondays at 06:00 UTC
#     workflow_dispatch:
#   jobs:
#     bump:
#       uses: navikt/copilot/.github/workflows/agentpakke-base-bump.yaml@main
#       permissions:
#         contents: write
#         pull-requests: write
#       # Optional. A pull request opened with the default github.token starts
#       # no workflows, so the bump PR gets no checks. A GitHub App token or a
#       # fine-grained PAT with contents and pull-requests write does.
#       secrets:
#         token: ${{ secrets.AGENTPAKKE_BUMP_TOKEN }}

on:
  workflow_call:
    secrets:
      token:
        description: 'Token that opens the pull request. Defaults to github.token, whose pull requests start no checks.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump the reused agentpakke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install nav-pilot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/navikt/copilot/main/scripts/install.sh | bash -s -- --no-brew
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bump the pin
        id: bump
        shell: bash
        env:
          # The stable-release lookup reads the GitHub API. A failed lookup
          # fails this step and leaves the pin alone rather than guessing.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=.nav-pilot/agentpakke.lock.json
          # Outside the workspace, so the body is not committed with the pin.
          nav-pilot pakke bump-base > "$RUNNER_TEMP/bump-body.md"
          # nav-pilot writes nothing when the pin is current.
          if git diff --quiet -- "$LOCK"; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "base=$(jq -r .source "$LOCK")" >> "$GITHUB_OUTPUT"
          fi

      # Opens the pull request, or updates the open one on the same branch.
      - name: Open or update the pull request
        if: steps.bump.outputs.moved == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.token || github.token }}
          sign-commits: true
          add-paths: .nav-pilot/agentpakke.lock.json
          commit-message: "chore: bump reused agentpakke ${{ steps.bump.outputs.base }}"
          title: "chore: bump reused agentpakke ${{ steps.bump.outputs.base }}"
          body-path: ${{ runner.temp }}/bump-body.md
          branch: agentpakke-base-bump
          delete-branch: true
