# Ecosystem conformance sweep.
#
# `nav-pilot validate` is documented for an agentpakke repo's own CI, which
# catches a package that drifts away from the contract. Nothing caught the
# opposite direction: a contract change here that quietly invalidates packages
# already published in the wild. Fixtures and a manual check were the whole net.
#
# This job builds nav-pilot from the pull request, discovers the published
# packages by code search, and runs the PR's validate against each. A package
# that stops conforming fails the job by name.
name: Agentpakke conformance sweep

on:
  pull_request:
    branches: [main]
    paths:
      - 'cli/nav-pilot/schemas/**'
      - 'cli/nav-pilot/internal/agentpakke/**'
      - 'cli/nav-pilot/internal/cli/validate.go'
      - '.github/workflows/agentpakke-sweep.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Validate published agentpakker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: cli/nav-pilot/go.mod
          cache: true

      - name: Build nav-pilot from this pull request
        run: cd cli/nav-pilot && go build -o "$RUNNER_TEMP/nav-pilot" .

      # navikt/copilot publishes an agentpakke too, and it is swept rather than
      # skipped as "covered elsewhere": the Go suite only holds the committed
      # manifest equal to the legacy adapter, which is manifest parity and not
      # the conformance check. It is validated from the workspace instead of
      # cloned, so a pull request that changes the contract and this repo's own
      # package is checked as the pair it is. Cloning would measure main's
      # package against the branch's contract, and pay for the largest clone in
      # the set to get the worse answer.
      - name: Validate this repo's own package
        run: '"$RUNNER_TEMP/nav-pilot" validate --source "$GITHUB_WORKSPACE"'

      # The measured query from navikt/copilot#819. It returns every repo
      # carrying .nav-pilot/agentpakke.json that the token can see.
      - name: Discover published agentpakker
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Packages known to publish. They are swept whether or not the search
          # names them, so a partial page degrades to a warning instead of to a
          # green run over a shrunken set. A package that retires for real is an
          # edit to this list, the same deliberate move as a version pin.
          known=$(printf '%s\n' navikt/copilot navikt/grillmester nais/pilot)

          # Code search needs auth, is rate limited, and can answer with a
          # partial page. All three look exactly like a healthy empty result,
          # so discovery must never let "could not look" read as "nothing to
          # validate".
          #
          # Throttling is the one failure that says nothing at all about the
          # change under review: the limit is per token and the org's CI shares
          # one, so a busy afternoon turns this guard red for someone else's
          # reasons. Retry it, waiting as long as the API asks rather than a
          # number picked here. gh puts the Retry-After hint straight into its
          # message ("try again in 42s (HTTP 429)"), and /rate_limit reports
          # x-ratelimit-reset without itself counting against any limit, so
          # both are readable without spending a request. Exponential backoff
          # is only the fallback when neither answers.
          budget=300 # seconds of waiting, summed over every attempt
          waited=0
          attempt=0
          throttled=
          err=
          until found=$(gh api -X GET search/code \
              -f q='path:.nav-pilot filename:agentpakke.json' \
              --jq '.items[].repository.full_name' 2>"$RUNNER_TEMP/discover-err"); do
            attempt=$((attempt + 1))
            err=$(cat "$RUNNER_TEMP/discover-err")

            # Anything that is not throttling fails closed on the spot. Retry
            # buys nothing against a bad query, a missing scope or a 404, and
            # waiting five minutes to say so wastes the reviewer's time.
            case $err in
              *429*|*'rate limit'*|*'Retry-After'*|*'try again in'*) ;;
              *)
                echo "::error::Code search failed, and not from throttling. A failed lookup is indistinguishable from an empty ecosystem, so the sweep fails rather than validating nothing."
                printf '%s\n' "$err" | sed 's/^/    /'
                exit 1
                ;;
            esac

            # gh prints a Go duration, not a number of seconds: "414.763551ms"
            # as readily as "60s" or "2m30s". Units are split off longest-first
            # so the pass is deterministic, then summed, then rounded up — a
            # sub-second wait becomes one second. Reading the leading digits
            # alone turned 414ms into 414s, which is how the first run of this
            # job spent its whole budget on two attempts.
            wait_s=$(printf '%s' "$err" |
              sed -n 's/.*try again in \([^ ]*\).*/\1/p' | head -n1 |
              sed -e 's/ns/ n /g' -e 's/µs/ u /g' -e 's/us/ u /g' \
                -e 's/ms/ i /g' -e 's/h/ h /g' -e 's/m/ m /g' -e 's/s/ s /g' |
              awk '{
                t = 0
                for (i = 1; i < NF; i += 2) {
                  v = $i + 0; u = $(i + 1)
                  if (u == "n") v /= 1000000000
                  else if (u == "u") v /= 1000000
                  else if (u == "i") v /= 1000
                  else if (u == "m") v *= 60
                  else if (u == "h") v *= 3600
                  t += v
                }
                if (t > 0) printf "%d\n", (t == int(t) ? t : int(t) + 1)
              }')
            if [ -z "$wait_s" ]; then
              reset=$(gh api rate_limit --jq '.resources.code_search.reset' 2>/dev/null || true)
              case $reset in
                [0-9]*) wait_s=$((reset - $(date +%s) + 1)) ;;
              esac
            fi
            case $wait_s in
              '' | *[!0-9]*) wait_s=$((1 << attempt)) ;; # 2, 4, 8, 16 ...
            esac
            [ "$wait_s" -gt 0 ] || wait_s=1

            # The cap is on total waiting, not on attempt count, so a long
            # Retry-After cannot park the job for the whole run budget. A wait
            # that would overrun what is left ends the retries instead of being
            # clipped: retrying before the API says it is ready only earns
            # another 429.
            remaining=$((budget - waited))
            if [ "$wait_s" -gt "$remaining" ]; then
              throttled=1
              break
            fi
            echo "::notice::Code search throttled (attempt $attempt). Waiting ${wait_s}s; ${remaining}s left of the ${budget}s retry budget."
            sleep "$wait_s"
            waited=$((waited + wait_s))
          done

          if [ -n "$throttled" ]; then
            # Degraded, not blind. Every package this repo knows about is still
            # swept below, so the pull request's contract is still measured
            # against the whole known ecosystem; what was lost is the lookup for
            # packages nobody here has heard of yet. That is worth a warning and
            # not a red build, because a guard that fails for someone else's
            # token usage gets ignored, and this one guards the contract.
            #
            # The known set stops being best-effort to earn that: the sweep step
            # below treats an unreachable known package as fatal when discovery
            # never completed, so "throttled" can only stay green on a run that
            # actually validated all of them.
            echo "::warning::Code search stayed throttled (attempts: $attempt, waited: ${waited}s, budget: ${budget}s). Sweeping the known packages only. The contract is still checked against every package this workflow knows about; an agentpakke published since that list was last edited is not covered by this run."
            printf '%s\n' "$err" | sed 's/^/    /'
            discovered=$known
          else
            discovered=$(printf '%s\n' "$found" | sed '/^$/d' | sort -u)
            if [ -z "$discovered" ]; then
              # Distinct from the warning above on purpose: the query ran and
              # answered. navikt/copilot publishes an agentpakke, so zero is a
              # broken query or a token that cannot see the results, and both
              # are this pull request's problem to fix.
              echo "::error::Code search completed and returned no agentpakker. This is not throttling: the query ran. navikt/copilot publishes one, so an empty answer is a broken query or a token that cannot see the results."
              exit 1
            fi
            echo "Discovered:"
            printf '%s\n' "$discovered" | sed 's/^/  /'

            printf '%s\n' "$known" | while IFS= read -r repo; do
              if ! printf '%s\n' "$discovered" | grep -qxF "$repo"; then
                echo "::warning::Code search did not return $repo, which is known to publish an agentpakke. The results were partial; sweeping it anyway."
              fi
            done

            # The known list is the whole coverage of a throttled run, so it
            # has to stay current. Nothing said so until now: a package the
            # search found and the list omits was swept anyway, and the gap
            # only showed up on the one run that could not afford it. Say it
            # on a healthy run, when adding the line is free.
            printf '%s\n' "$discovered" | while IFS= read -r repo; do
              if ! printf '%s\n' "$known" | grep -qxF "$repo"; then
                echo "::notice::$repo publishes an agentpakke and is not in the known list in this workflow. It is swept on a healthy run, but a throttled run falls back to the known list and would miss it. Add it to \`known\`."
              fi
            done
          fi

          # navikt/copilot was validated from the workspace above.
          targets=$(printf '%s\n%s\n' "$discovered" "$known" |
            sort -u | grep -vxF navikt/copilot || true)

          # Every target costs a shallow clone, so the sweep is capped instead
          # of growing with the ecosystem. What falls outside the cap is named,
          # never dropped quietly — the day this warns is the day the sweep
          # needs sharding rather than a larger number.
          max=25
          count=$(printf '%s\n' "$targets" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" -gt "$max" ]; then
            printf '%s\n' "$targets" | tail -n "+$((max + 1))" | while IFS= read -r repo; do
              echo "::warning::$repo was not swept: the cap is $max packages and $count were discovered."
            done
            targets=$(printf '%s\n' "$targets" | head -n "$max")
          fi

          # Non-empty only on a throttled run: the packages whose validation is
          # the entire reason that run is allowed to stay green.
          required=
          [ -z "$throttled" ] || required=$(printf '%s\n' "$known" | grep -vxF navikt/copilot || true)

          {
            echo 'targets<<SWEEP_EOF'
            printf '%s\n' "$targets"
            echo SWEEP_EOF
            echo 'required<<SWEEP_EOF'
            printf '%s\n' "$required"
            echo SWEEP_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Sweep
        env:
          TARGETS: ${{ steps.discover.outputs.targets }}
          REQUIRED: ${{ steps.discover.outputs.required }}
        run: |
          set -euo pipefail
          fatal=0
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            echo "::group::$repo"
            # A package that no longer conforms and a package that could not be
            # cloned both exit 1. Stdout tells them apart: validate writes its
            # JSON report before exiting, and a source that never resolved has
            # no report to write.
            if report=$("$RUNNER_TEMP/nav-pilot" validate --source "$repo" --json \
                2>"$RUNNER_TEMP/err" </dev/null); then
              echo "$repo conforms."
            elif jq -e . >/dev/null 2>&1 <<<"$report"; then
              # What this job exists to catch. Fatal, and named with its findings.
              echo "::error::$repo no longer conforms to the agentpakke contract."
              jq -r '.problems[]' <<<"$report" | sed 's/^/    /'
              fatal=1
            elif printf '%s\n' "$REQUIRED" | grep -qxF "$repo"; then
              # Only reachable on a throttled run, where the known set is all
              # the coverage there is. A known package that never validated
              # means the contract went unchecked against part of it, and
              # warning twice does not add up to having looked.
              echo "::error::$repo could not be swept, and code search was throttled, so there is no wider discovered set to fall back on. The contract was not checked against the known packages."
              sed 's/^/    /' "$RUNNER_TEMP/err"
              fatal=1
            else
              # Private, moved, deleted, or a flaky network. Reported, not
              # fatal: an unreachable repo says nothing about the contract, and
              # failing on one would hand anybody outside this org a veto over
              # merges here.
              echo "::warning::$repo could not be swept — unreachable (private, moved or deleted?)."
              sed 's/^/    /' "$RUNNER_TEMP/err"
            fi
            echo '::endgroup::'
          done <<SWEEP_TARGETS
          $TARGETS
          SWEEP_TARGETS
          exit "$fatal"
