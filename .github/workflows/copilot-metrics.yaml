name: copilot-metrics build-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/copilot-metrics/**'
      - '.github/workflows/copilot-metrics.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/copilot-metrics/**'
      - '.github/workflows/copilot-metrics.yaml'
      - '.github/workflows/mise-build-deploy-nais.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  # Read public npm packages (@nais/apm) from GitHub Packages.
  packages: read

jobs:
  build:
    uses: ./.github/workflows/mise-build-deploy-nais.yaml
    with:
      working-directory: apps/copilot-metrics
      mise-setup-tasks: '["install"]'
      mise-tasks: '["lint", "check"]'
      deploys-to-nais: true
      deploy-pr-to-dev: true
      nais-resource: '.nais/naisjob.yaml,.nais/billing.yaml,.nais/mimir.yaml'
      nais-team: copilot
      nais-clusters: '["dev-gcp", "prod-gcp"]'
