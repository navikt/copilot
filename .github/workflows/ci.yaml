# Merge-queue-compatible CI gate for the monorepo.
#
# Runs on every pull request AND on merge_group (merge queue) entries,
# detects which components changed (dorny/paths-filter — merge_group is not
# supported by path filters in `on:`), runs only the affected components'
# check tasks, and reports a single check named `ci-ok`.
#
# `ci-ok` is intended to be the single required status check in the branch
# ruleset. It succeeds when every needed job succeeded or was skipped
# (including the nothing-changed case) and fails if anything failed or was
# cancelled.
#
# The per-component workflows (copilot-api.yaml, my-copilot.yaml, ...) still
# run on pull_request/push for PR-preview deploys and post-merge deploys —
# they are intentionally NOT required checks and do NOT run in the queue.

name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel merge_group runs; superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      copilot-adoption: ${{ steps.filter.outputs.copilot-adoption }}
      copilot-api: ${{ steps.filter.outputs.copilot-api }}
      copilot-cli: ${{ steps.filter.outputs.copilot-cli }}
      copilot-survey: ${{ steps.filter.outputs.copilot-survey }}
      copilot-metrics: ${{ steps.filter.outputs.copilot-metrics }}
      mcp-onboarding: ${{ steps.filter.outputs.mcp-onboarding }}
      mcp-registry: ${{ steps.filter.outputs.mcp-registry }}
      my-copilot: ${{ steps.filter.outputs.my-copilot }}
      nav-pilot: ${{ steps.filter.outputs.nav-pilot }}
      docs: ${{ steps.filter.outputs.docs }}
      link-guard: ${{ steps.filter.outputs.link-guard }}
    steps:
      # Full history so paths-filter can diff merge_group base..head with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # A conflict resolved by hand can leave a marker line behind, as a
      # diff3 "|||||||" line once did in the changelog. Every tracked text file.
      - name: No merge conflict markers
        run: |
          if git grep -nIE '^(<<<<<<< |\|\|\|\|\|\|\| |=======$|>>>>>>> )'; then
            echo "::error::merge conflict markers left in the lines above"
            exit 1
          fi
      # v4.0.1+ is required for native merge_group support (v3 has none).
      # Each filter mirrors the component workflow's own on.pull_request.paths,
      # plus this workflow file so editing the gate re-tests everything.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # ratchet:dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            copilot-adoption:
              - 'apps/copilot-adoption/**'
              - '.github/workflows/copilot-adoption.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-api:
              - 'apps/copilot-api/**'
              - 'apps/my-copilot/src/lib/model-pricing.ts'
              - 'scripts/generate-api-model-metadata.mjs'
              - '.github/workflows/copilot-api.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-cli:
              - 'apps/copilot-cli/**'
              - '.github/workflows/copilot-cli.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-survey:
              - 'apps/copilot-survey/**'
              - '.github/workflows/copilot-survey.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-metrics:
              - 'apps/copilot-metrics/**'
              - '.github/workflows/copilot-metrics.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            mcp-onboarding:
              - 'apps/mcp-onboarding/**'
              - 'agents/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'skills/**'
              - '.github/workflows/mcp-onboarding.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            mcp-registry:
              - 'apps/mcp-registry/**'
              - '.github/workflows/mcp-registry.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            my-copilot:
              - 'apps/my-copilot/**'
              - 'apps/copilot-survey/surveys/schema.json'
              - 'docs/news/**/*.md'
              - 'agents/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'skills/**'
              - '.github/workflows/my-copilot.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            nav-pilot:
              - 'cli/nav-pilot/**'
              - 'apps/copilot-survey/surveys/schema.json'
              - 'scripts/install.sh'
              - 'scripts/*.bats'
              - '.github/workflows/copilot-customization-sync.yml'
              - 'skills/**'
              - 'agents/**'
              - '.nav-pilot/**'
              - 'instructions/**'
              - 'prompts/**'
              - '.github/workflows/nav-pilot-ci.yaml'
              - '.github/workflows/ci.yaml'
              - 'dashboards/nav-pilot-*.json'
              - 'scripts/build-local-dashboard.py'
            docs:
              - 'agents/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'skills/**'
              - 'docs/**'
              - 'README.md'
              - 'scripts/generate-docs/**'
              - '.github/workflows/docs.yaml'
              - '.github/workflows/ci.yaml'
            # Files apps/my-copilot/src/link-inventory.test.ts scans for links
            # to ki-utvikling.nav.no, and the MCP ids it checks ?item= against.
            link-guard:
              - 'apps/my-copilot/**'
              - 'apps/mcp-registry/allowlist.json'
              - '**/*.md'
              - 'cli/**/*.go'
              - 'scripts/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/workflows/ci.yaml'

  # ── mise-based app checks ──────────────────────────────────────────────────
  # Each job replicates the Check job of the reusable mise-build-deploy-nais
  # workflow for that app: mise setup ("install") followed by the same
  # mise-tasks the component workflow passes ("lint", "check").
  # No docker build, no deploy.

  copilot-adoption:
    name: copilot-adoption
    needs: changes
    if: needs.changes.outputs.copilot-adoption == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-adoption
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-api:
    name: copilot-api
    needs: changes
    if: needs.changes.outputs.copilot-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-cli:
    name: copilot-cli
    needs: changes
    if: needs.changes.outputs.copilot-cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-survey:
    name: copilot-survey
    needs: changes
    if: needs.changes.outputs.copilot-survey == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-survey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # check-frozen-surveys.sh diffs against the base
      - name: Opened surveys keep their questions
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: ./check-frozen-surveys.sh "$BASE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-metrics:
    name: copilot-metrics
    needs: changes
    if: needs.changes.outputs.copilot-metrics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  mcp-onboarding:
    name: mcp-onboarding
    needs: changes
    if: needs.changes.outputs.mcp-onboarding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mcp-onboarding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  mcp-registry:
    name: mcp-registry
    needs: changes
    if: needs.changes.outputs.mcp-registry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mcp-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  my-copilot:
    name: my-copilot
    needs: changes
    if: needs.changes.outputs.my-copilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/my-copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  # ── links to ki-utvikling.nav.no ───────────────────────────────────────────
  # Runs only the link inventory test, also when a README, doc, CLI string or
  # script changes. No build, no deploy.

  link-guard:
    name: link-guard
    needs: changes
    if: needs.changes.outputs.link-guard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/my-copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - run: mise run install
      - run: mise exec -- pnpm vitest run src/link-inventory.test.ts

  # ── nav-pilot installer CLI ────────────────────────────────────────────────
  # Mirrors nav-pilot-ci.yaml's build-and-test, shellcheck and bats jobs
  # (including the coverage floor). The e2e installer matrix stays in
  # nav-pilot-ci.yaml only.

  nav-pilot:
    name: nav-pilot
    needs: changes
    if: needs.changes.outputs.nav-pilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: cli/nav-pilot/go.mod
          cache: true
      - name: Build
        run: cd cli/nav-pilot && go build -o nav-pilot .
      - name: Test and Coverage
        run: |
          cd cli/nav-pilot && go test -race -v -coverpkg=./... -coverprofile=cover.out -skip TestLaunchBudget ./...
          go tool cover -func=cover.out
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')
          floor=65
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t + 0 < f + 0) {
              print "ERROR: coverage " t "% is below floor " f "%"
              exit 1
            }
            print "Coverage " t "% meets floor " f "%"
          }'
          rm -f cover.out
      # Alone, without -race: it times nav-pilot, and the other packages'
      # tests running beside it would time the runner instead.
      - name: Launch budget
        run: cd cli/nav-pilot && go test ./e2e -run TestLaunchBudget -count=1 -v
      - name: Vet
        run: cd cli/nav-pilot && go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          cd cli/nav-pilot && staticcheck ./...
      - name: Persona transcripts selftest
        run: python3 cli/nav-pilot/e2e/persona_transcripts.py --selftest
      # nav-pilot-local.json is generated: a hand edit, or a change to the
      # house style it copies from nav-pilot-cli.json, means nav-pilot-local.json
      # must be regenerated.
      - name: Local dashboard is generated
        run: python3 scripts/build-local-dashboard.py --check
      - name: ShellCheck
        run: shellcheck scripts/install.sh skills/*/*.sh
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4.3.0
        with:
          experimental: true
      - name: Run BATS
        run: mise exec -- bats scripts/install.bats scripts/sync-pr-body.bats scripts/obs-query.bats

  # ── docs and skills content checks ─────────────────────────────────────────
  # Mirrors docs.yaml's "Docs in sync" and "Skills quality" jobs.

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: scripts/generate-docs/go.mod
      - name: Docs in sync
        run: cd scripts/generate-docs && go run . --check
      - name: Lint skills
        run: bash scripts/lint-skills.sh
      - name: Test the skill linter
        run: bash scripts/test-lint-skills.sh
      - name: Upgrade gh CLI (gh skill requires 2.90.0+)
        run: |
          GH_VERSION=2.90.0
          curl -sSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tar.gz
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo cp "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version
      - name: Validate agentskills.io spec
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  # ── secret scanning ────────────────────────────────────────────────────────
  # Gates PRs and the merge queue on secrets in the commits they add. Scans only
  # that range: the full fetch holds every branch, and a fixture on an unrelated
  # branch must not fail every PR. gitleaks.yaml scans full history on push to
  # main. Always runs (no path filter).

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # Full history so the base of the range is present
          fetch-depth: 0
      - name: Download gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request) range="origin/${PR_BASE:?}..HEAD" ;;
            merge_group)  range="${MQ_BASE:?}..${MQ_HEAD:?}" ;;
            *)            range="HEAD" ;; # workflow_dispatch: full history of the ref
          esac
          # gitleaks exits 0 on an unknown revision, so resolve the range first.
          git rev-list -n1 "$range" > /dev/null
          echo "Scanning $range"
          # -m: also scan merge commits' diffs, e.g. a conflict resolution.
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 --log-opts="-m $range" .

  # ── the gate ───────────────────────────────────────────────────────────────
  # Single check to require in the branch ruleset. Succeeds when every needed
  # job succeeded or was skipped (nothing relevant changed); fails when any
  # needed job failed or was cancelled.

  ci-ok:
    name: ci-ok
    needs:
      - changes
      - copilot-adoption
      - copilot-api
      - copilot-cli
      - copilot-survey
      - copilot-metrics
      - mcp-onboarding
      - mcp-registry
      - my-copilot
      - nav-pilot
      - docs
      - link-guard
      - gitleaks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "❌ One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All required jobs succeeded or were skipped"
