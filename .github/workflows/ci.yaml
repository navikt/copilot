# Merge-queue-compatible CI gate for the monorepo.
#
# Runs on every pull request AND on merge_group (merge queue) entries,
# detects which components changed (dorny/paths-filter — merge_group is not
# supported by path filters in `on:`), runs only the affected components'
# check tasks, and reports a single check named `ci-ok`.
#
# `ci-ok` is intended to be the single required status check in the branch
# ruleset. It succeeds when every needed job succeeded or was skipped
# (including the nothing-changed case) and fails if anything failed or was
# cancelled.
#
# The per-component workflows (copilot-api.yaml, my-copilot.yaml, ...) still
# run on pull_request/push for PR-preview deploys and post-merge deploys —
# they are intentionally NOT required checks and do NOT run in the queue.

name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel merge_group runs; superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse-code-checks: ${{ steps.reuse.outputs.reuse }}
      copilot-adoption: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.copilot-adoption || 'false' }}
      copilot-api: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.copilot-api || 'false' }}
      copilot-cli: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.copilot-cli || 'false' }}
      copilot-survey: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.copilot-survey || 'false' }}
      copilot-metrics: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.copilot-metrics || 'false' }}
      mcp-onboarding: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.mcp-onboarding || 'false' }}
      mcp-registry: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.mcp-registry || 'false' }}
      my-copilot: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.my-copilot || 'false' }}
      nav-pilot: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.nav-pilot || 'false' }}
      docs: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.docs || 'false' }}
      link-guard: ${{ steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.link-guard || 'false' }}
    steps:
      # When a PR description or title is edited (no base branch change, same
      # head SHA), skip re-running code checks if a completed ci.yaml run on
      # this exact SHA already passed gitleaks and every component check.
      - name: Check if code checks already passed for HEAD SHA
        id: reuse
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          runs=$(gh api "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${HEAD_SHA}&event=pull_request&status=completed&per_page=10" \
            --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID}) | .id" 2>/dev/null || true)
          for run_id in $runs; do
            ok=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '([.jobs[] | select(.name == "gitleaks" and .conclusion == "success")] | length == 1) and ([.jobs[] | select(.name != "pr-body-check" and .name != "ci-ok")] | (length > 0) and all(.conclusion == "success" or .conclusion == "skipped"))' 2>/dev/null || echo "false")
            if [ "$ok" = "true" ]; then
              echo "Reusing green code checks from run ${run_id} for SHA ${HEAD_SHA}"
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "reuse=false" >> "$GITHUB_OUTPUT"
      # Full history so paths-filter can diff merge_group base..head with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        if: steps.reuse.outputs.reuse != 'true'
        with:
          fetch-depth: 0
      # A conflict resolved by hand can leave a marker line behind, as a
      # diff3 "|||||||" line once did in the changelog. Every tracked text file.
      - name: No merge conflict markers
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          if git grep -nIE '^(<<<<<<< |\|\|\|\|\|\|\| |=======$|>>>>>>> )'; then
            echo "::error::merge conflict markers left in the lines above"
            exit 1
          fi
      # v4.0.1+ is required for native merge_group support (v3 has none).
      # Each filter mirrors the component workflow's own on.pull_request.paths,
      # plus this workflow file so editing the gate re-tests everything.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # ratchet:dorny/paths-filter@v4.0.3
        id: filter
        if: steps.reuse.outputs.reuse != 'true'
        with:
          filters: |
            copilot-adoption:
              - 'apps/copilot-adoption/**'
              - '.github/workflows/copilot-adoption.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-api:
              - 'apps/copilot-api/**'
              - 'apps/my-copilot/src/lib/model-pricing.ts'
              - 'scripts/generate-api-model-metadata.mjs'
              - '.github/workflows/copilot-api.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-cli:
              - 'apps/copilot-cli/**'
              - '.github/workflows/copilot-cli.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-survey:
              - 'apps/copilot-survey/**'
              - '.github/workflows/copilot-survey.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            copilot-metrics:
              - 'apps/copilot-metrics/**'
              - '.github/workflows/copilot-metrics.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            mcp-onboarding:
              - 'apps/mcp-onboarding/**'
              - 'agents/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'skills/**'
              - '.github/workflows/mcp-onboarding.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            mcp-registry:
              - 'apps/mcp-registry/**'
              - '.github/workflows/mcp-registry.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            my-copilot:
              - 'apps/my-copilot/**'
              - 'apps/copilot-survey/surveys/schema.json'
              - 'docs/news/**/*.md'
              - 'docs/golden-baselines/summary.json'
              - 'agents/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'skills/**'
              - '.github/workflows/my-copilot.yaml'
              - '.github/workflows/mise-build-deploy-nais.yaml'
              - '.github/workflows/ci.yaml'
            nav-pilot:
              - 'cli/nav-pilot/**'
              - 'apps/my-copilot/src/app/(nb)/(nav-pilot)/nav-pilot/klienter/page.tsx'
              - 'apps/copilot-survey/surveys/schema.json'
              - 'scripts/install.sh'
              - 'scripts/*.bats'
              - '.github/workflows/copilot-customization-sync.yml'
              - 'skills/**'
              - 'agents/**'
              - '.nav-pilot/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'hooks/**'
              - '.github/hooks/**'
              - '.github/copilot-instructions.md'
              - '.github/instructions/**'
              - 'scripts/check-harness-budget.py'
              - '.github/workflows/nav-pilot-ci.yaml'
              - '.github/workflows/ci.yaml'
              - 'dashboards/nav-pilot-*.json'
              - 'scripts/build-local-dashboard.py'
              - 'scripts/nav-pilot-golden.sh'
              - 'scripts/benchmark-*.py'
              - 'scripts/blindspot-judge.py'
              - 'scripts/test_blindspot_judge.py'
              - 'scripts/golden-fixtures/**'
              - 'docs/golden-baselines/**'
              - '.mise.toml'
            docs:
              - 'agents/**'
              - 'instructions/**'
              - 'prompts/**'
              - 'skills/**'
              - 'docs/**'
              - 'README.md'
              - 'scripts/generate-docs/**'
              - 'extensions/**'
              - '.nav-pilot/retired-artifacts.json'
              - 'scripts/generate-retired/**'
              - 'scripts/lint-skills.sh'
              - 'scripts/test-lint-skills.sh'
              - 'scripts/check-harness-budget.py'
              - 'hooks/**'
              - '.github/hooks/**'
              - '.github/copilot-instructions.md'
              - '.github/instructions/**'
              - '.github/skills-allowlist.txt'
              - '.github/workflows/docs.yaml'
              - '.github/workflows/ci.yaml'
            # Files apps/my-copilot/src/link-inventory.test.ts scans for links
            # to ki-utvikling.nav.no, and the MCP ids it checks ?item= against.
            link-guard:
              - 'apps/my-copilot/**'
              - 'apps/mcp-registry/allowlist.json'
              - '**/*.md'
              - 'cli/**/*.go'
              - 'scripts/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/workflows/ci.yaml'

  # ── mise-based app checks ──────────────────────────────────────────────────
  # Each job replicates the Check job of the reusable mise-build-deploy-nais
  # workflow for that app: mise setup ("install") followed by the same
  # mise-tasks the component workflow passes ("lint", "check").
  # No docker build, no deploy.

  copilot-adoption:
    name: copilot-adoption
    needs: changes
    if: needs.changes.outputs.copilot-adoption == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-adoption
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-api:
    name: copilot-api
    needs: changes
    if: needs.changes.outputs.copilot-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-cli:
    name: copilot-cli
    needs: changes
    if: needs.changes.outputs.copilot-cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-survey:
    name: copilot-survey
    needs: changes
    if: needs.changes.outputs.copilot-survey == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-survey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # check-frozen-surveys.sh diffs against the base
      - name: Opened surveys keep their questions
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: ./check-frozen-surveys.sh "$BASE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  copilot-metrics:
    name: copilot-metrics
    needs: changes
    if: needs.changes.outputs.copilot-metrics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/copilot-metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  mcp-onboarding:
    name: mcp-onboarding
    needs: changes
    if: needs.changes.outputs.mcp-onboarding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mcp-onboarding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  mcp-registry:
    name: mcp-registry
    needs: changes
    if: needs.changes.outputs.mcp-registry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mcp-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  my-copilot:
    name: my-copilot
    needs: changes
    if: needs.changes.outputs.my-copilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/my-copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise run lint
      - run: mise run check

  # ── links to ki-utvikling.nav.no ───────────────────────────────────────────
  # Runs only the link inventory test, also when a README, doc, CLI string or
  # script changes. No build, no deploy.

  link-guard:
    name: link-guard
    needs: changes
    if: needs.changes.outputs.link-guard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/my-copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      - run: mise run install
      - run: mise exec -- pnpm vitest run src/link-inventory.test.ts

  # ── nav-pilot installer CLI ────────────────────────────────────────────────
  # Mirrors nav-pilot-ci.yaml's build-and-test, shellcheck and bats jobs
  # (including the coverage floor). The e2e installer matrix stays in
  # nav-pilot-ci.yaml only.

  nav-pilot:
    name: nav-pilot
    needs: changes
    if: needs.changes.outputs.nav-pilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: cli/nav-pilot/go.mod
          cache: true
      - name: Build
        run: cd cli/nav-pilot && go build -o nav-pilot .
      - name: Test and Coverage
        run: |
          cd cli/nav-pilot && go test -race -v -coverpkg=./... -coverprofile=cover.out -skip TestLaunchBudget ./...
          go tool cover -func=cover.out
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')
          floor=65
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t + 0 < f + 0) {
              print "ERROR: coverage " t "% is below floor " f "%"
              exit 1
            }
            print "Coverage " t "% meets floor " f "%"
          }'
          rm -f cover.out
      # Alone, without -race: it times nav-pilot, and the other packages'
      # tests running beside it would time the runner instead.
      - name: Launch budget
        run: cd cli/nav-pilot && go test ./e2e -run TestLaunchBudget -count=1 -v
      - name: Vet
        run: |
          cd cli/nav-pilot
          go vet ./...
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt -w these files:"; echo "$unformatted"; exit 1; fi
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          cd cli/nav-pilot && staticcheck ./...
      - name: Hook selftests
        run: |
          for f in hooks/*.py; do
            python3 "$f" --selftest
            diff -q "$f" ".github/hooks/$(basename "$f")"
          done
      - name: Harness and customization budget
        run: |
          python3 scripts/check-harness-budget.py --selftest
          python3 scripts/check-harness-budget.py
      - name: Persona transcripts selftest
        run: python3 cli/nav-pilot/e2e/persona_transcripts.py --selftest
      # nav-pilot-local.json is generated: a hand edit, or a change to the
      # house style it copies from nav-pilot-cli.json, means nav-pilot-local.json
      # must be regenerated.
      - name: Local dashboard is generated
        run: python3 scripts/build-local-dashboard.py --check
      - name: ShellCheck
        run: shellcheck scripts/install.sh skills/*/*.sh
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          experimental: true
      # ubuntu-latest moved to 26.04, whose default JDK is too new for the
      # golden fixtures' Kotlin 2.1. Pin JDK 21 so the gradle controls run.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Run BATS
        run: mise exec -- bats scripts/install.bats scripts/sync-pr-body.bats scripts/skill-selvutlosning-probe.bats scripts/nav-pilot-golden.bats scripts/obs-query.bats
      - name: Benchmark checks (offline)
        run: mise run benchmark:check

  # ── docs and skills content checks ─────────────────────────────────────────
  # Mirrors docs.yaml's "Docs in sync" and "Skills quality" jobs.

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: scripts/generate-docs/go.mod
      - name: Docs in sync
        run: cd scripts/generate-docs && go run . --check
      # Needs the full history the checkout above fetches: the record is read
      # out of every deleted artifact's past blobs.
      - name: Retired-artifact record is current
        run: cd scripts/generate-retired && go test ./... && go run . --check
      - name: Lint skills
        run: bash scripts/lint-skills.sh
      - name: Test the skill linter
        run: bash scripts/test-lint-skills.sh
      - name: Check harness and customization budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 scripts/check-harness-budget.py --selftest
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check-harness-budget.py --diff "$BASE_SHA"
          else
            python3 scripts/check-harness-budget.py
          fi
      - name: Upgrade gh CLI (gh skill requires 2.90.0+)
        run: |
          GH_VERSION=2.90.0
          GH_SHA256=b2aef7b23ec6899bf27f37a32c57a7935d0a178568ac33dc9bb03842f724195a
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tar.gz
          echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo cp "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version
      - name: Validate agentskills.io spec
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  # ── secret scanning ────────────────────────────────────────────────────────
  # Gates PRs and the merge queue on secrets in the commits they add. Scans only
  # that range: the full fetch holds every branch, and a fixture on an unrelated
  # branch must not fail every PR. gitleaks.yaml scans full history on push to
  # main. Always runs (no path filter).

  gitleaks:
    name: gitleaks
    needs: changes
    if: needs.changes.outputs.reuse-code-checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # Full history so the base of the range is present
          fetch-depth: 0
      - name: Download gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request) range="origin/${PR_BASE:?}..HEAD" ;;
            merge_group)  range="${MQ_BASE:?}..${MQ_HEAD:?}" ;;
            *)            range="HEAD" ;; # workflow_dispatch: full history of the ref
          esac
          # gitleaks exits 0 on an unknown revision, so resolve the range first.
          git rev-list -n1 "$range" > /dev/null
          echo "Scanning $range"
          # -m: also scan merge commits' diffs, e.g. a conflict resolution.
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 --log-opts="-m $range" .

  # ── PR body template check ─────────────────────────────────────────────────
  # Ensures pull requests include the required sections from
  # .github/pull_request_template.md and do not use Norwegian issue-closing
  # keywords that GitHub ignores. Automated bots and sync branches are exempt.

  pr-body-check:
    name: pr-body-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR description against template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          actor = os.environ.get("ACTOR", "")
          head_ref = os.environ.get("HEAD_REF", "")
          exempt_prefixes = (
              "copilot-sync/",
              "pricing-sync/",
              "agentpakke-sweep/",
              "dependabot/",
              "release/",
          )
          if actor.endswith("[bot]") or head_ref.startswith(exempt_prefixes):
              print(f"Skipping PR body check for automated PR (actor={actor}, ref={head_ref})")
              sys.exit(0)

          body = os.environ.get("PR_BODY") or ""
          repo = os.environ.get("REPO", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          if repo and pr_number:
              res = subprocess.run(
                  ["gh", "api", f"repos/{repo}/pulls/{pr_number}", "--jq", '.body // ""'],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0:
                  body = res.stdout
          stripped = re.sub(r"<!--.*?-->", "", body, flags=re.S)

          required = [
              ("## Summary", ("## Summary", "## Oppsummering", "## Hva", "## Bakgrunn"), False),
              (
                  "## Risk profile & rollout",
                  ("## Risk profile & rollout", "## Risikoprofil og utrulling", "## Risiko og utrulling", "## Risiko"),
                  True,
              ),
              ("## Security considerations", ("## Security considerations", "## Sikkerhetsvurderinger", "## Sikkerhet"), False),
              ("## Test plan", ("## Test plan", "## Testplan", "## Verifisering"), False),
          ]
          errors = []

          for label, aliases, needs_checkbox in required:
              pattern = r"^(?:" + "|".join(re.escape(a) for a in aliases) + r")\s*$"
              m = re.search(pattern, stripped, flags=re.M | re.I)
              if not m:
                  errors.append(f"Missing required heading: '{label}' (accepted: {', '.join(aliases)})")
                  continue
              start = m.end()
              next_h = re.search(r"^##\s+\S", stripped[start:], flags=re.M)
              section = stripped[start : start + next_h.start()] if next_h else stripped[start:]
              content = re.sub(r"-\s*\[\s*\]\s*.*", "", section).strip()
              if not content:
                  errors.append(f"Section '{label}' is empty (please fill it in)")
              if needs_checkbox and not re.search(r"-\s*\[[xX]\]", section):
                  errors.append(
                      f"Section '{label}' must have at least one checked item (- [x])"
                  )

          prose = re.sub(r"```.*?```|`[^`\n]+`", "", stripped, flags=re.S)
          bad_close = re.findall(r"\b(?:lukker|fikser|løser)\s+#\d+\b", prose, flags=re.I)
          if bad_close:
              errors.append(
                  f"Use English issue-closing keywords ('Closes #NNN' or 'Fixes #NNN') instead of {', '.join(bad_close)}"
              )

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              print(
                  "\nPlease fill in all sections of .github/pull_request_template.md.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("PR body matches .github/pull_request_template.md")
          PY

  # ── the gate ───────────────────────────────────────────────────────────────
  # Single check to require in the branch ruleset. Succeeds when every needed
  # job succeeded or was skipped (nothing relevant changed); fails when any
  # needed job failed or was cancelled.

  ci-ok:
    name: ci-ok
    needs:
      - changes
      - copilot-adoption
      - copilot-api
      - copilot-cli
      - copilot-survey
      - copilot-metrics
      - mcp-onboarding
      - mcp-registry
      - my-copilot
      - nav-pilot
      - docs
      - link-guard
      - gitleaks
      - pr-body-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "❌ One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All required jobs succeeded or were skipped"
