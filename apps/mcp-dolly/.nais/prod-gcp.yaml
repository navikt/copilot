# shortcut: confirmation tokens use a per-pod random key and a per-pod single-use set, so run exactly 1 replica;
# move the key to a Nais secret and the set to Postgres before allowing >1 replica.
replicas_min: "2"
replicas_max: "2"
cpu_threshold: "80"
cpu_request: 50m
memory_request: 64Mi
memory_limit: 256Mi
log_level: "INFO"
dolly_url: "https://dolly-backend.ekstern.dev.nav.no"
dolly_scope: "api://dev-gcp.dolly.dolly-backend/.default"
# Empty means off: clients without form elicitation cannot order in prod (#2613).
create_order_two_step: ""
