# 2 replicas are safe: keys are shared via the Nais secret mcp-dolly-keys, single use and quota live in Postgres,
# and the per-pod boot ID is cleared in Postgres mode, so a token issued on one pod confirms once on any pod.
replicas_min: "2"
replicas_max: "2"
cpu_threshold: "80"
cpu_request: 10m
memory_request: 64Mi
memory_limit: 256Mi
log_level: "INFO"
dolly_url: "https://dolly-backend.ekstern.dev.nav.no"
dolly_scope: "api://dev-gcp.dolly.dolly-backend/.default"
create_order_two_step: "true"
