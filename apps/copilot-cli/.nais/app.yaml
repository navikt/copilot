apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: copilot-cli
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 8080
  # One pod: the token cache and the GitHub cache-miss limiters (middleware.go)
  # live in memory. A second pod would double the global rate against GitHub's
  # 5,000/hour quota and keep serving a revoked token from its own cache for up
  # to 5 minutes. More pods need a shared store (or the global rate divided by
  # the pod count, plus a shorter cache TTL).
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  prometheus:
    enabled: true
    path: /metrics
  # naisdevice-only ingress: nav-pilot on developer laptops.
  ingresses:
    {{#each ingresses}}
    - {{this}}
    {{/each}}
  # For the M2M tokens to copilot-api and copilot-survey. No inbound callers use Entra.
  azure:
    application:
      enabled: true
      tenant: {{azure_tenant}}
  # The nav-pilot GitHub App's GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET,
  # and nothing else. Created by hand in the Nais console; see README.
  envFrom:
    - secret: copilot-cli
  env:
    - name: GITHUB_ORG
      value: "{{github_org}}"
    - name: COPILOT_API_URL
      value: "{{copilot_api_url}}"
    - name: LOG_LEVEL
      value: "{{log_level}}"
  accessPolicy:
    outbound:
      rules:
        - application: copilot-api
          namespace: {{namespace}}
        - application: copilot-survey
          namespace: {{namespace}}
      external:
        - host: api.github.com
