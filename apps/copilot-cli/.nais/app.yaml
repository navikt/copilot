apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: copilot-cli
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 8080
  # Exactly one: the survey queue and its dedup live in the pod's memory
  # (store.go). More replicas would let one person answer twice.
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  prometheus:
    enabled: true
    path: /metrics
  # naisdevice-only ingress: nav-pilot on developer laptops. ki-utvikling
  # (my-copilot) calls in-cluster, server to server, with an OBO token.
  ingresses:
    {{#each ingresses}}
    - {{this}}
    {{/each}}
  azure:
    application:
      enabled: true
      tenant: {{azure_tenant}}
      # Every Nav user may get an OBO token for this app via my-copilot.
      allowAllUsers: true
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: {{db_tier}}
        # Query insights would keep query samples next to their times; the
        # survey tables must not have that side channel.
        insights:
          enabled: false
        databases:
          - name: copilot-cli
            envVarPrefix: DB
  # The nav-pilot GitHub App's credentials (GITHUB_CLIENT_ID,
  # GITHUB_CLIENT_SECRET, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY,
  # GITHUB_APP_INSTALLATION_ID) and one SURVEY_KEY_<ID> per open survey.
  # Created by hand in the Nais console; see README.
  envFrom:
    - secret: copilot-cli
  env:
    - name: GITHUB_ORG
      value: "{{github_org}}"
    - name: COPILOT_API_URL
      value: "{{copilot_api_url}}"
    - name: LOG_LEVEL
      value: "{{log_level}}"
  accessPolicy:
    inbound:
      rules:
        - application: my-copilot
          namespace: {{namespace}}
    outbound:
      rules:
        - application: copilot-api
          namespace: {{namespace}}
      external:
        - host: api.github.com
