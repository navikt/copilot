apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: mcp-kodeverk
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 10
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
  env:
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "{{log_level}}"
    - name: KODEVERK_URL
      value: "{{kodeverk_url}}"
    - name: KODEVERK_SCOPE
      value: "{{kodeverk_scope}}"
    - name: GOMEMLIMIT
      value: "200MiB"
    # MCP 2026-07-28 is the target. Initialize-era clients (OpenCode default)
    # are served until this date; unset means 2026-07-28 only. See echo/mcp2026.go.
    # Legacy cutoff decided in #2351; kept in sync across MCP server manifests.
    - name: MCP_LEGACY_PROTOCOL_UNTIL
      value: "2027-03-31"
  accessPolicy:
    inbound:
      rules:
        - application: fleet-gateway
          namespace: copilot
    outbound:
      rules:
        - application: kodeverk-api
          namespace: team-rocket
