apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "copilot-api"
  namespace: "copilot"
spec:
  image: {{image}}
  port: 8080

  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true

  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
    logging:
      destinations:
        - id: loki

  envFrom:
    - secret: copilot-api

  env:
    - name: "LOG_LEVEL"
      value: "{{log_level}}"
    - name: "LOGGED_ENDPOINTS"
      value: "{{logged_endpoints}}"
    - name: "GITHUB_ORG"
      value: "navikt"
    - name: "COPILOT_METRICS_DATASET"
      value: "copilot_metrics"
    - name: "COPILOT_METRICS_TABLE"
      value: "usage_metrics"
    - name: "COPILOT_ADOPTION_DATASET"
      value: "copilot_adoption"
    - name: "VIDEO_FEED_CACHE_SECONDS"
      value: "{{video_feed_cache_seconds}}"
    - name: "VIDEO_MANIFEST_URL"
      value: "gs://{{video_bucket_public}}/video_manifest.json"
    - name: "VIDEO_BUCKET_PUBLIC"
      value: "{{video_bucket_public}}"

  liveness:
    path: "/health"
    port: 8080
    initialDelay: 10
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3

  readiness:
    path: "/ready"
    port: 8080
    initialDelay: 10
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3

  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 75

  prometheus:
    enabled: true
    path: "/metrics"

  resources:
    limits:
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

  gcp:
    buckets:
      - name: "{{video_bucket_public}}"
    bigQueryDatasets:
      - name: copilot_metrics
        permission: READ
      - name: copilot_adoption
        permission: READ

  accessPolicy:
    inbound:
      rules:
        - application: my-copilot
          namespace: copilot
        - application: copilot-cli
          namespace: copilot
        # Only for POST /internal/v1/saml/name-id (see internal_handlers.go).
        - application: copilot-survey
          namespace: copilot
    outbound:
      external:
        - host: api.github.com
        - host: bigquery.googleapis.com
        - host: storage.googleapis.com
        - host: login.microsoftonline.com
---
# Burst alert for the accepted risk in SECURITY.md: every survey answer from
# nav-pilot makes copilot-survey look up one e-mail here. Normal traffic is at
# most a few a minute, so more than 20 in 5 minutes is worth a look.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: copilot-api-alerts
  namespace: copilot
  labels:
    team: copilot
spec:
  groups:
    - name: copilot-api
      rules:
        - alert: CopilotApiSamlNameIdBurst
          expr: sum(increase(copilot_api_saml_name_id_requests_total{app="copilot-api"}[5m])) > 20
          labels:
            namespace: copilot
            severity: warning
          annotations:
            summary: More than 20 SAML name-id lookups in copilot-api in 5 minutes
            consequence: Something is resolving many GitHub logins to e-mails. In dev-gcp that is copilot-survey, and copilot-cli may be answering surveys on behalf of members. In prod-gcp nothing should call this route yet.
            action: Compare with survey_submissions_total on copilot-survey and check copilot-cli's logs for the same window (see SECURITY.md).
