apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: copilot-survey
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 8080
  # Exactly one: the survey queue and its dedup live in the pod's memory
  # (store.go). More replicas would let one person answer twice.
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  prometheus:
    enabled: true
    path: /metrics
  # No ingress: copilot-cli and my-copilot call it in-cluster. No
  # observability.autoInstrumentation either: a trace of a submission would
  # time-stamp who answered, which the batching exists to hide.
  azure:
    application:
      enabled: true
      tenant: {{azure_tenant}}
      # Every Nav user may get an OBO token for this app via my-copilot.
      allowAllUsers: true
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: {{db_tier}}
        # Query insights would keep query samples next to their times; the
        # survey tables must not have that side channel.
        insights:
          enabled: false
        databases:
          - name: copilot-survey
            envVarPrefix: DB
  # One SURVEY_KEY_<ID> per open survey, nothing else. Created by hand in the
  # Nais console before a survey opens, deleted the day after it closes; see
  # README.
  envFrom:
    - secret: copilot-survey
  env:
    - name: COPILOT_API_URL
      value: http://copilot-api
    - name: LOG_LEVEL
      value: "{{log_level}}"
  accessPolicy:
    inbound:
      rules:
        - application: copilot-cli
          namespace: {{namespace}}
        - application: my-copilot
          namespace: {{namespace}}
    outbound:
      rules:
        # Only POST /internal/v1/saml/name-id.
        - application: copilot-api
          namespace: {{namespace}}
---
# Burst alert for the accepted risk in SECURITY.md: a compromised copilot-cli
# could answer for many members at once. Normal traffic is at most a few
# answers a minute, so more than 20 in 5 minutes is worth a look.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: copilot-survey-alerts
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  groups:
    - name: copilot-survey
      rules:
        - alert: CopilotSurveySubmissionBurst
          expr: sum(increase(survey_submissions_total{app="copilot-survey"}[5m])) > 20
          labels:
            namespace: {{namespace}}
            severity: warning
          annotations:
            summary: More than 20 survey submissions to copilot-survey in 5 minutes
            consequence: Many answers or answer attempts in a short window. If they are stored (status 201), copilot-cli may be answering for members who did not, and forged answers cannot be told apart once stored. A burst of 409 or 503 is more likely a copilot-cli retry loop.
            action: Check copilot-cli's logs and deploys for the same window. If the burst is not explained by a survey launch, close the survey and discard its answers (see SECURITY.md).
