apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: copilot-survey
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 8080
  # Exactly one: the survey queue and its dedup live in the pod's memory
  # (store.go). More replicas would let one person answer twice.
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  prometheus:
    enabled: true
    path: /metrics
  # No ingress: copilot-cli and my-copilot call it in-cluster. No
  # observability.autoInstrumentation either: a trace of a submission would
  # time-stamp who answered, which the batching exists to hide.
  azure:
    application:
      enabled: true
      tenant: {{azure_tenant}}
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: {{db_tier}}
        # Query insights would keep query samples next to their times; the
        # survey tables must not have that side channel.
        insights:
          enabled: false
        databases:
          - name: copilot-survey
            envVarPrefix: DB
  # One SURVEY_KEY_<ID> per open survey, nothing else. Created by hand in the
  # Nais console before a survey opens, deleted the day after it closes; see
  # README.
  envFrom:
    - secret: copilot-survey
  env:
    - name: COPILOT_API_URL
      value: http://copilot-api
    - name: LOG_LEVEL
      value: "{{log_level}}"
  accessPolicy:
    inbound:
      rules:
        - application: copilot-cli
          namespace: {{namespace}}
        - application: my-copilot
          namespace: {{namespace}}
    outbound:
      rules:
        # Only POST /internal/v1/saml/name-id.
        - application: copilot-api
          namespace: {{namespace}}
