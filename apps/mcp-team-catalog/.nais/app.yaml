apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: mcp-team-catalog
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 10
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  prometheus:
    enabled: true
    path: /metrics
    port: "9090"
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
  env:
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "{{log_level}}"
    - name: TEAM_CATALOG_URL
      value: "{{team_catalog_url}}"
    - name: TEAM_CATALOG_SCOPE
      value: "{{team_catalog_scope}}"
    - name: GOMEMLIMIT
      value: "300MiB"
    # MCP 2026-07-28 is the target. Initialize-era clients (OpenCode default)
    # are served until this date; unset means 2026-07-28 only. See echo/mcp2026.go.
    # Legacy cutoff decided in #2351; kept in sync across MCP server manifests.
    - name: MCP_LEGACY_PROTOCOL_UNTIL
      value: "2027-03-31"
  accessPolicy:
    inbound:
      rules:
        - application: fleet-gateway
          namespace: copilot
    outbound:
      rules:
        - application: team-catalog-backend
          namespace: org
