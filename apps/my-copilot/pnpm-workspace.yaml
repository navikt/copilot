allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides for transitive dependencies pinned by their parents —
# scoped to the vulnerable ranges so they become no-ops once parents catch up.
overrides:
  # Dependabot alert #130: esbuild dev-server file read on Windows; storybook@10.4.5 caps esbuild at ^0.27.0
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  # Dependabot alert #133: @opentelemetry/core unbounded memory in W3C Baggage propagation; @opentelemetry 0.218.0 packages pin core 2.7.1 exactly
  "@opentelemetry/core@<2.8.0": "2.8.0"
  # Dependabot alert #143 og #231: sharp arver libvips/librsvg-sårbarheter; next@16.4 tillater ^0.35.3, men pnpm løfter ikke låsen av seg selv
  "sharp@<0.35.5": "0.35.5"
  # @opentelemetry/sdk-trace-web 2.12.0 and core declare peer @opentelemetry/api <1.10.0; drop once they accept 1.10
  "@opentelemetry/api": "~1.9.1"
  # Dependabot alert #162 og #171: postcss leser vilkårlige .map-filer via sourceMappingURL; @tailwindcss/postcss@4.3.1 pinner postcss til 8.5.15 eksakt
  "postcss@<8.5.23": "8.5.26"
  # Dependabot alert #173: js-yaml kvadratisk CPU-bruk i !!omap; gray-matter@4.0.3 tillater ^3.13.1, men pnpm løfter ikke låsen av seg selv
  "js-yaml@<3.15.1": "3.15.2"
  # Dependabot alert #172: samme !!omap-sak i 4.x; cosmiconfig tillater ^4.1.0
  "js-yaml@>=4.0.0 <4.3.1": "4.3.2"
  # Dependabot alert #141, #142, #167, #196, #197 og #266-#269: fast-uri; ajv@8.20.0 tillater ^3.0.1
  "fast-uri@<3.1.9": "3.1.9"
  # Dependabot alert #136 og #201: brace-expansion; minimatch@3.1.5 tillater ^1.1.7
  "brace-expansion@<1.1.21": "1.1.21"
  # Dependabot alert #135: samme sak i 5.x; minimatch@10.2.5 tillater ^5.0.5
  "brace-expansion@>=3.0.0 <5.0.7": "5.0.9"
  # GHSA-3jxr-9vmj-r5cp dekker et tredje område, >=2.0.0 <2.1.2, som ingen
  # forelder trekker inn i dag. Tatt med så en framtidig forelder som pinner 2.x
  # ikke kommer inn upatchet uten at noen legger merke til det.
  "brace-expansion@>=2.0.0 <2.1.2": "2.1.2"
  # Dependabot alert #243 og #247-#250: vite/launch-editor; vitest@5.0.5 tillater ^8.0.0, men pnpm løfter ikke låsen av seg selv
  "vite@<8.1.6": "8.1.6"
  # Dependabot alert #198: path traversal; @storybook/builder-webpack5@10.6.x pinner ^6.1.2, og fiksen finnes bare i 7.4.6. Kun Storybook dev-server.
  "webpack-dev-middleware@<7.4.6": "7.4.6"
