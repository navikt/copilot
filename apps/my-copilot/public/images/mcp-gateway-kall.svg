<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 355" width="720" height="261" role="img" aria-labelledby="mcp-gateway-call-title">
  <title id="mcp-gateway-call-title">Slik går et kall: Copilot CLI eller OpenCode på utviklermaskinen kaller fleet-gateway og holder tokenene selv. cplt-broker er valgfri og ikke tilgjengelig ennå. Brukeren logger inn med Nav-konto via Entra, og fleet-gateway henter et OBO-token fra Texas og kaller teamets MCP-server, som sjekker aud, idtyp, azp og NAVident.</title>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .bg { fill: #ffffff; }
      .fg-box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .fg-fleet { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .fg-host { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .fg-title { fill: #0f172a; font-size: 20px; font-weight: 700; }
      .fg-sub { fill: #475569; font-size: 17px; }
      .fg-group { fill: #1e3a8a; font-size: 18px; font-weight: 700; }
      .fg-line { stroke: #475569; stroke-width: 1.75; fill: none; }
      .fg-head { fill: #475569; }
    </style>
    <marker id="fg-arrow-call" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" class="fg-head"/>
    </marker>
  </defs>
  <rect width="980" height="355" class="bg"/>
  <rect x="15" y="20" width="400" height="180" rx="14" class="fg-host"/>
  <text x="35" y="50" class="fg-group">Utviklermaskin</text>
  <rect x="30" y="65" width="370" height="80" rx="10" class="fg-box"/>
  <text x="215" y="97" text-anchor="middle" class="fg-title">Copilot CLI eller OpenCode</text>
  <text x="215" y="123" text-anchor="middle" class="fg-sub">logger inn og holder tokenene selv</text>
  <text x="215" y="180" text-anchor="middle" class="fg-sub">cplt-broker: valgfri, ikke tilgjengelig ennå</text>

  <rect x="445" y="20" width="240" height="170" rx="14" class="fg-fleet"/>
  <text x="465" y="50" class="fg-group">MCP-gateway</text>
  <rect x="460" y="65" width="210" height="110" rx="10" class="fg-box"/>
  <text x="565" y="97" text-anchor="middle" class="fg-title">fleet-gateway</text>
  <text x="565" y="123" text-anchor="middle" class="fg-sub">innlogging med</text>
  <text x="565" y="144" text-anchor="middle" class="fg-sub">Nav-konto via Entra</text>

  <rect x="445" y="235" width="240" height="100" rx="10" class="fg-box"/>
  <text x="565" y="267" text-anchor="middle" class="fg-title">Texas</text>
  <text x="565" y="293" text-anchor="middle" class="fg-sub">veksler til OBO-token</text>
  <text x="565" y="314" text-anchor="middle" class="fg-sub">for teamets server</text>

  <rect x="745" y="65" width="225" height="130" rx="10" class="fg-box"/>
  <text x="857" y="97" text-anchor="middle" class="fg-title">Teamets MCP-server</text>
  <text x="857" y="123" text-anchor="middle" class="fg-sub">sjekker aud, idtyp,</text>
  <text x="857" y="144" text-anchor="middle" class="fg-sub">azp og NAVident</text>

  <line x1="400" y1="105" x2="458" y2="105" class="fg-line" marker-end="url(#fg-arrow-call)"/>
  <line x1="565" y1="177" x2="565" y2="233" class="fg-line" marker-start="url(#fg-arrow-call)" marker-end="url(#fg-arrow-call)"/>
  <line x1="670" y1="125" x2="743" y2="125" class="fg-line" marker-end="url(#fg-arrow-call)"/>
  <text x="706" y="113" text-anchor="middle" class="fg-sub">OBO</text>
</svg>
