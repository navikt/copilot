apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "my-copilot"
  namespace: "copilot"
  annotations:
    "nais.io/run-as-group": "65532"
    "nais.io/run-as-user": "65532"
spec:
  image: {{image}}
  port: 3000
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      claims:
        groups:
          - id: 48120347-8582-4329-8673-7beb3ed6ca06 # dev
          - id: 76e9ee7e-2cd1-4814-b199-6c0be007d7b4 # dev
          - id: eb5c5556-6c9a-4e54-83fc-f70cae25358d # dev
          - id: 879f302e-73e9-48bf-8103-16edd8606c4a # infra
          - id: afcbfed4-d5d4-4964-8db5-f59b6f61b929 # azure
          - id: 8396d3ec-e263-49c7-b72a-87440d7ee3f4 # design
          - id: c0b6df4d-35b4-4312-aaaa-74ea33108875 # GitHub Copilot Produktutvikling
          - id: f59c8c77-7b73-4753-890a-2b483a07d18a # team copilot (admin, kostnadsinnsikt)
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
      # Static assets
      - /_next/**
      - /public/**
      - /demos/**
      - /videos/**
      - /images/**
      - /*.svg
      - /*.png
      - /favicon.ico
      - /robots.txt
      - /sitemap.xml
      - /search-index.json
      - /news.json
      # OAuth endpoints (handled by Wonderwall sidecar)
      - /oauth2/**
      # All page routes — auth is handled in the application layer.
      # This lets Next.js show login redirects instead of raw Wonderwall intercepts.
      - /
      - /nyheter
      - /nyheter/**
      # English articles. The list enumerates every public route, so a new one
      # is invisible to anonymous readers until it is added here.
      - /en
      - /en/**
      - /praksis
      - /praksis/**
      - /verktoy
      - /verktoy/**
      - /ordliste
      - /ordliste/**
      - /ordbok
      - /ordbok/**
      - /nav-pilot
      - /nav-pilot/**
      - /cplt
      - /cplt/**
      - /kom-i-gang
      - /kom-i-gang/**
      - /retningslinjer
      - /retningslinjer/**
      - /install
      - /install/**
      - /personvern
      - /tilgjengelighet
      - /statistikk
      - /statistikk/**
      - /adopsjon
      - /adopsjon/**
      - /kostnad
      - /kostnad/**
      - /abonnement
      - /abonnement/**
      - /kalkulator
      - /kalkulator/**
      - /priser
      - /priser/**
      - /modeller
      - /modeller/**
      - /reisen
      - /innsikt
      - /innsikt/team
      - /innsikt/team/rapport
      - /innsikt/forbruk
      - /innsikt/bruk
      - /innsikt/tilpasninger
      - /innsikt/trender
      - /innsikt/lokale-modeller
      - /admin
      - /admin/kostnad
      - /admin/kostnad/rapport
      - /admin/undersokelser/**
      # Old paths with a permanent redirect in next.config.ts. Listed so the
      # redirect answers before Wonderwall does; the private targets
      # (/innsikt/bruk, /innsikt/tilpasninger, /innsikt/trender) still require a login in src/proxy.ts.
      - /best-practices
      - /practice
      - /customizations
      - /usage
      - /stats
      - /overview
      - /cost
      - /innsikt/kostnad
      - /admin/kostnad/innsyn
      # Health (metrics NOT listed — Wonderwall blocks public access, Prometheus scrapes pod directly)
      - /health
      # NOTE: /api/copilot and /api/adoption are NOT listed — Wonderwall enforces auth for APIs
  prometheus:
    enabled: true
    path: /metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
  frontend:
    generatedConfig:
      mountPath: /tmp/nais.js
  env:
    - name: "COPILOT_ADMIN_GROUP_ID"
      value: "f59c8c77-7b73-4753-890a-2b483a07d18a"
    - name: "NODE_ENV"
      value: "production"
    - name: "GITHUB_ORG"
      value: "navikt"
    - name: "NEXT_TELEMETRY_DISABLED"
      value: "1"
    - name: OTEL_METRICS_EXPORTER
      value: otlp
    - name: OTEL_LOGS_EXPORTER
      value: otlp
    - name: OTEL_TRACES_EXPORTER
      value: otlp
    - name: OTEL_EXPORTER_METRICS_ENABLED
      value: "true"
    - name: OTEL_METRICS_EXEMPLAR_FILTER
      value: ALWAYS_ON
    - name: MCP_REGISTRY_URL
      value: "{{mcp_registry_url}}"
    - name: MCP_REGISTRY_PUBLIC_URL
      value: "{{mcp_registry_public_url}}"
    - name: COPILOT_API_URL
      value: "http://copilot-api"
  {{#if copilot_survey_url}}
    - name: COPILOT_SURVEY_URL
      value: "{{copilot_survey_url}}"
  {{/if}}
  liveness:
    path: "/health"
    port: 3000
  readiness:
    path: "/health"
    port: 3000
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: "512Mi"
    requests:
      cpu: "10m"
      memory: "128Mi"

  accessPolicy:
    outbound:
      rules:
        - application: copilot-api
          namespace: copilot
        - application: mcp-registry
          namespace: copilot
      {{#if copilot_survey_url}}
        - application: copilot-survey
          namespace: copilot
      {{/if}}
      external:
        - host: api.github.com
        - host: avatars.githubusercontent.com
        - host: login.microsoftonline.com
        - host: raw.githubusercontent.com
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
---
# Post-mortem #1804: my-copilot had no alerts. All rules go to
# #github-copilot-alerts through my-copilot-slack below.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-copilot-alerts
  namespace: copilot
  labels:
    team: copilot
spec:
  groups:
    - name: my-copilot
      rules:
        - alert: MyCopilotRequestErrors
          expr: sum(increase(my_copilot_request_errors_total{namespace="copilot", app="my-copilot"}[10m])) > 0
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: my-copilot
          annotations:
            summary: A route handler, server action or page in my-copilot threw an unhandled error
            consequence: A user got an error page or a failed action, for example a survey answer or an admin action that did not go through.
            action: Search Loki for "Unhandled request error" in service_name my-copilot. The route field names the failing route.
        - alert: MyCopilotHigh5xxRate
          expr: |
            (
              sum(increase(nginx_ingress_controller_requests{namespace="copilot", service="my-copilot", status=~"5.."}[10m]))
              /
              sum(increase(nginx_ingress_controller_requests{namespace="copilot", service="my-copilot"}[10m]))
            ) > 0.05
            and
            sum(increase(nginx_ingress_controller_requests{namespace="copilot", service="my-copilot"}[10m])) > 50
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: my-copilot
          annotations:
            summary: More than 5 % of requests to my-copilot returned 5xx over 10 minutes
            consequence: Pages or APIs on ki-utvikling.nav.no are failing for a share of users.
            action: Check the my-copilot pod (restarts, OOM) and its error logs, and whether copilot-api, mcp-registry or copilot-survey is down.
        # Next.js logs "Failed to find Server Action" itself, outside
        # onRequestError, so only the logs see it. Nais has no LogQL rules for
        # teams; loki:service:loglevel:count1m is the log metric it offers.
        - alert: MyCopilotErrorLogs
          expr: sum(sum_over_time(loki:service:loglevel:count1m{service_namespace="copilot", service_name="my-copilot", detected_level="error"}[15m:1m])) > 20
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: my-copilot
          annotations:
            summary: More than 20 error logs from my-copilot in 15 minutes
            consequence: Something is failing repeatedly, for example a server action the browser can no longer find after a deploy.
            action: Search Loki for service_name my-copilot at level error and look for the repeated message.
---
# Same pattern as copilot-survey: rules opt in with alert_type: custom and
# app: my-copilot, and go to #github-copilot-alerts via Nais's slack-webhook.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: my-copilot-slack
  namespace: copilot
  labels:
    alertmanagerConfig: my-copilot-slack
spec:
  receivers:
    - name: my-copilot-slack
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: apiUrl
          channel: "#github-copilot-alerts"
          sendResolved: true
          # Nais's own slack.* templates, so messages look like the team default.
          # The backslash keeps the deploy step's Handlebars from rendering them.
          title: '\{{ template "slack.title" . }}'
          text: '\{{ template "slack.text" . }}'
          color: '\{{ template "slack.color" . }}'
  route:
    groupBy:
      - alertname
    matchers:
      # Nais runs the operator without namespace enforcement, so match it here.
      - name: namespace
        matchType: "="
        value: copilot
      - name: alert_type
        matchType: "="
        value: custom
      - name: app
        matchType: "="
        value: my-copilot
    receiver: my-copilot-slack
