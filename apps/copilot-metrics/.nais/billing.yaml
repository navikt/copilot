apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: copilot-user-billing
  namespace: copilot
spec:
  image: {{image}}
  schedule: "0 {{billing_hour}} * * *"
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  command:
    - /app/copilot-metrics
    - --user-billing-sync
  envFrom:
    - secret: copilot-metrics
  env:
    - name: USER_BILLING_SYNC_ENABLED
      value: "true"
    - name: GITHUB_ENTERPRISE_SLUG
      value: "nav"
    - name: GITHUB_ORG
      value: "navikt"
    - name: BIGQUERY_DATASET
      value: "copilot_metrics"
  gcp:
    bigQueryDatasets:
      - name: copilot_metrics
        permission: READWRITE
        description: "GitHub Copilot usage metrics"
  accessPolicy:
    outbound:
      external:
        - host: api.github.com
        - host: copilot-reports.github.com
        - host: bigquery.googleapis.com
        - host: storage.googleapis.com
        - host: hooks.slack.com
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
