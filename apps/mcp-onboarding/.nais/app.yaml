apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: mcp-onboarding
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelay: 5
    timeout: 1
    periodSeconds: 10
    failureThreshold: 3
  prometheus:
    enabled: true
    path: /metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
  ingresses:
    {{#each ingresses}}
    - {{this}}
    {{/each}}
  env:
    - name: BASE_URL
      value: "{{base_url}}"
    - name: ALLOWED_ORGANIZATION
      value: "{{allowed_organization}}"
    - name: LOG_LEVEL
      value: "{{log_level}}"
    # Legacy cutoff decided in #2351; kept in sync across MCP server manifests.
    # Serves initialize-era MCP clients (OpenCode default) until this date.
    - name: MCP_LEGACY_PROTOCOL_UNTIL
      value: "2027-03-31"
  envFrom:
    - secret: mcp-onboarding-secrets
  {{#if fleet_gateway_inbound}}
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
  {{/if}}
  accessPolicy:
    {{#if fleet_gateway_inbound}}
    inbound:
      rules:
        - application: fleet-gateway
          namespace: copilot
    {{/if}}
    outbound:
      external:
        - host: api.github.com
        - host: github.com
