# Deployed by .github/workflows/fleet-control.yaml. Owner steps: README.md "Prod rollout" (#2754).
cluster: prod-gcp
env: prod
replicas_min: "1"
replicas_max: "2"
cpu_request: 50m
memory_request: 64Mi
memory_limit: 128Mi
# Caller client ids come from AZURE_APP_PRE_AUTHORIZED_APPS, which Nais fills
# from accessPolicy.inbound. No agent seed and no static team list in prod.
