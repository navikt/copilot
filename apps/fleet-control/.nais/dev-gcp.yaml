cluster: dev-gcp
env: dev
replicas_min: "1"
replicas_max: "2"
cpu_request: 50m
memory_request: 64Mi
memory_limit: 128Mi
# Measured 15Mi in dev (kubectl top, 2026-11-25); 128Mi has ample headroom.
gomemlimit: 115MiB
# Entra client ids of the callers in dev-gcp, from
# `kubectl -n copilot get azureapp <app> -o jsonpath='{.status.clientId}'`.
fleet_gateway_client_id: 3c9d6972-9c61-4a8c-9450-2274dd721345
mcp_registry_client_id: 92693693-8566-4ce5-b778-a4d58e5b24f7
my_copilot_client_id: 1c401702-0190-41fa-9c19-faeae7b8fa5c
# Agent profile drafts to seed (#2582). Never set in prod. The studio-api
# client id in the file is a placeholder: the profile stays unverified.
seed_agents_file: /app/seed/agents.dev.json
# Secret holding FLEET_CONTROL_STATIC_TEAMS. Never set in prod.
static_teams_secret: fleet-control-static-teams
# Secret holding FLEET_SLACK_WEBHOOK_URL (ROS FG-14). Uncomment once the
# owner has created it; a missing secret stops the pod.
# slack_webhook_secret: fleet-control-slack
