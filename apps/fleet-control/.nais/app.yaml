# dev-gcp and prod-gcp (#2754). No ingress: the API is reachable in-cluster only,
# and accessPolicy.inbound admits only its callers. Each request also
# needs the caller's Entra token, checked against the client ids below.
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fleet-control
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
  readiness:
    path: /ready
    initialDelay: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      # Any Nav employee may get an OBO token; fleet-control's team check
      # decides access.
      allowAllUsers: true
  uses:
    postgres:
      - name: fleet-control
  prometheus:
    enabled: true
    path: /metrics
{{#if static_teams_secret}}
  envFrom:
{{else}}{{#if slack_webhook_secret}}
  envFrom:
{{/if}}{{/if}}
{{#if static_teams_secret}}
    # Key FLEET_CONTROL_STATIC_TEAMS: JSON of team to member emails, created by
    # a human. Dev only: the app refuses the list outside dev-* clusters.
    - secret: {{static_teams_secret}}
{{/if}}
{{#if slack_webhook_secret}}
    # Key FLEET_SLACK_WEBHOOK_URL: Slack incoming webhook for team copilot's
    # channel (ROS FG-14). Set the variable only once the secret exists: a
    # missing envFrom secret stops the pod. Unset, no notices are sent.
    - secret: {{slack_webhook_secret}}
{{/if}}
  env:
    # Soft heap limit at about 90 % of the memory limit, so GC runs before an OOM kill.
    - name: GOMEMLIMIT
      value: "{{gomemlimit}}"
    - name: PORT
      value: "8080"
    - name: SEED_ROUTES_FILE
      value: /app/seed/pilot-routes.{{env}}.yaml
    - name: SEED_ALLOWLIST_FILE
      value: /app/seed/allowlist.json
    # Agent profile drafts, dev only (#2582). Empty: no seed.
    - name: SEED_AGENTS_FILE
      value: "{{ seed_agents_file }}"
    # Full Entra client ids; the app refuses to start without them.
    - name: FLEET_GATEWAY_CLIENT_ID
      value: "{{fleet_gateway_client_id}}"
    - name: MCP_REGISTRY_CLIENT_ID
      value: "{{mcp_registry_client_id}}"
    # Client id for my-copilot's OBO tokens on the /apis and /admin write routes.
    - name: MY_COPILOT_CLIENT_ID
      value: "{{my_copilot_client_id}}"
    # Platform team: the only approver of MCPServer versions, in every
    # namespace; MCPServer revocation everywhere, vendor registry names and the
    # global job kill switch (#2634, #2752). Empty: nobody can approve.
    - name: FLEET_CONTROL_OPERATOR_TEAM
      value: "{{ operator_team }}"
    # Owner decision 2026-11-24: Loki keeps the audit archive, the DB deletes
    # audit_events older than 90 days.
    - name: FLEET_AUDIT_RETENTION_DELETE
      value: "true"
  accessPolicy:
    # Nais Console API for team membership (#2625), with the service account
    # bound to this workload in Console.
    outbound:
      external:
        - host: console.nav.cloud.nais.io
    inbound:
      rules:
        - application: fleet-gateway
          namespace: copilot
        - application: mcp-registry
          namespace: copilot
        - application: my-copilot
          namespace: copilot
---
# Alerts for fleet-control (#2891). Runbooks are in the README under "Alerts".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fleet-control-alerts
  namespace: copilot
  labels:
    team: copilot
spec:
  groups:
    - name: fleet-control
      rules:
        - alert: FleetControlDown
          expr: absent(up{namespace="copilot", app="fleet-control"} == 1)
          for: 5m
          labels:
            namespace: copilot
            severity: critical
            alert_type: custom
            app: fleet-control
          annotations:
            summary: No fleet-control pod is up
            consequence: Writes fail and gateways serve their last snapshot. New gateway pods cannot start serving routes.
            action: "See the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-control/README.md#fleetcontroldown
        - alert: FleetControlHigh5xxRate
          expr: |
            sum(rate(fleet_control_http_requests_total{namespace="copilot", code=~"5.."}[5m]))
              / sum(rate(fleet_control_http_requests_total{namespace="copilot"}[5m])) > 0.1
            and sum(increase(fleet_control_http_requests_total{namespace="copilot"}[5m])) > 20
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-control
          annotations:
            summary: More than 10 % of fleet-control responses are 5xx
            consequence: Gateways, the registry or my-copilot get errors from fleet-control.
            action: "Break down fleet_control_http_requests_total by route and code. See the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-control/README.md#fleetcontrolhigh5xxrate
        - alert: FleetControlConsoleLookupsFailing
          expr: sum(increase(fleet_control_console_lookups_total{namespace="copilot", outcome!="ok"}[10m])) >= 3
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-control
          annotations:
            summary: Nais Console team lookups from fleet-control are failing
            consequence: Team checks fail closed, so writes and admin reads answer 503.
            action: "Break down fleet_control_console_lookups_total by outcome. See the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-control/README.md#fleetcontrolconsolelookupsfailing
        - alert: FleetControlDBErrors
          expr: sum(increase(fleet_control_db_errors_total{namespace="copilot"}[10m])) > 5
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-control
          annotations:
            summary: fleet-control database statements are failing
            consequence: Writes, audit inserts and snapshot builds can fail. Gateways keep the last snapshot.
            action: "Check the Postgres instance and pod logs. See the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-control/README.md#fleetcontroldberrors
        - alert: FleetControlSnapshotStale
          expr: time() - max by (kind) (fleet_control_snapshot_last_success_timestamp_seconds{namespace="copilot"}) > 600
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-control
          annotations:
            summary: fleet-control has not built a snapshot of one kind (see the kind label) for more than 10 minutes
            consequence: Gateways or the registry get the last good snapshot, so changes and revocations do not reach them.
            action: "Search the logs for `snapshot rebuild failed`. See the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-control/README.md#fleetcontrolsnapshotstale
