# Dev only for now (#2334). No ingress: the API is reachable in-cluster only,
# and accessPolicy.inbound admits only its callers. Each request also
# needs the caller's Entra token, checked against the client ids below.
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fleet-control
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 5
  readiness:
    path: /ready
    initialDelay: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      # Any Nav employee may get an OBO token; fleet-control's team check
      # decides access.
      allowAllUsers: true
  uses:
    postgres:
      - name: fleet-control
  {{#if static_teams_secret}}
  # Key FLEET_CONTROL_STATIC_TEAMS: JSON of team to member emails, created by
  # a human. Dev only: the app refuses the list outside dev-* clusters.
  envFrom:
    - secret: {{static_teams_secret}}
  {{/if}}
  env:
    - name: PORT
      value: "8080"
    - name: SEED_ROUTES_FILE
      value: /app/seed/pilot-routes.{{env}}.yaml
    - name: SEED_ALLOWLIST_FILE
      value: /app/seed/allowlist.json
    # Agent profile drafts, dev only (#2582). Empty: no seed.
    - name: SEED_AGENTS_FILE
      value: "{{ seed_agents_file }}"
    # Full Entra client ids; the app refuses to start without them.
    - name: FLEET_GATEWAY_CLIENT_ID
      value: "{{fleet_gateway_client_id}}"
    - name: MCP_REGISTRY_CLIENT_ID
      value: "{{mcp_registry_client_id}}"
    # Mounts the /admin routes for my-copilot's OBO tokens; ignored outside dev-*.
    - name: MY_COPILOT_CLIENT_ID
      value: "{{my_copilot_client_id}}"
  accessPolicy:
    # Nais Console API for team membership (#2625), with the service account
    # bound to this workload in Console.
    outbound:
      external:
        - host: console.nav.cloud.nais.io
    inbound:
      rules:
        - application: fleet-gateway
          namespace: copilot
        - application: mcp-registry
          namespace: copilot
        - application: my-copilot
          namespace: copilot
