# dev (provisioned 2026-11-22): nais apply -t copilot -e dev-gcp .nais/postgres.yaml
# prod: not provisioned yet, see README.md "Prod rollout" (#2754).
version: v1
type: Postgres
name: fleet-control
spec:
  majorVersion: "18"
  resources:
    cpu: 100m
    memory: 512Mi
    diskSize: 5Gi
  # Point-in-time recovery window (default 2 days). 7 covers a weekend plus
  # a few days to notice a bad write. See README, Backup and restore.
  backup:
    retentionDays: 7
