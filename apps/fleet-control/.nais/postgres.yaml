# dev (provisioned 2026-11-22): nais apply -t copilot -e dev-gcp .nais/postgres.yaml
# Deployed with the app by .github/workflows/fleet-control.yaml (nais-resource).
version: v1
type: Postgres
name: fleet-control
spec:
  majorVersion: "18"
  resources:
    cpu: 100m
    memory: 512Mi
    diskSize: 5Gi
  # Point-in-time recovery window in days (spec.pitr.windowDays, 2-30, default 2).
  # 7 covers a weekend plus a few days to notice a bad write. See README, Backup and restore.
  pitr:
    windowDays: 7
