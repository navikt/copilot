apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: mcp-registry
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 30
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  prometheus:
    enabled: true
    path: /metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
  uses:
    postgres:
      - name: mcp-registry
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      claims:
        groups:
          - id: "{{admin_group_id}}"
  env:
    {{#if registry_source}}
    # fleet-control (#2641) serves the static entries, allowlist.json until the first good snapshot.
    # shadow (#2765) fetches the snapshot for comparison and keeps serving allowlist.json.
    - name: REGISTRY_SOURCE
      value: "{{registry_source}}"
    - name: FLEET_CONTROL_URL
      value: "http://fleet-control"
    - name: FLEET_CONTROL_AUDIENCE
      value: "api://{{cluster}}.copilot.fleet-control/.default"
    {{/if}}
    - name: ADMIN_GROUP_ID
      value: "{{admin_group_id}}"
    # Only my-copilot may write. Resolved to its client id through
    # AZURE_APP_PRE_AUTHORIZED_APPS, which the inbound rule below provides.
    - name: ALLOWED_WRITE_AZP
      value: "{{cluster}}:copilot:my-copilot"
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "INFO"
    - name: DOMAIN_INTERNAL
      value: "{{domain_internal}}"
    - name: DOMAIN_EXTERNAL
      value: "{{domain_external}}"
    - name: LOGGED_ENDPOINTS
      value: "/,/v0.1/servers"
    - name: SERVICE_NAME
      value: "mcp-registry"
  accessPolicy:
    inbound:
      rules:
        - application: my-copilot
          namespace: copilot
    {{#if registry_source}}
    outbound:
      rules:
        - application: fleet-control
    {{/if}}
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
{{#if registry_source}}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mcp-registry-alerts
  namespace: copilot
  labels:
    team: copilot
spec:
  groups:
    - name: mcp-registry
      rules:
        - alert: McpRegistrySnapshotStale
          expr: max(registry_fleet_control_snapshot_age_seconds{namespace="copilot"}) > 600
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: mcp-registry
          annotations:
            summary: An mcp-registry pod has not fetched a fleet-control registry snapshot for more than 10 minutes
            consequence: The pod keeps serving its last server list (allowlist.json in shadow mode), so changes published in fleet-control do not reach the registry.
            action: "Check fleet-control health, then search mcp-registry pod logs for `keeping last good set` or `Shadow fleet-control snapshot not compared`."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/mcp-registry/README.md#fleet-control-source
        - alert: McpRegistrySnapshotFetchFailing
          expr: sum(increase(registry_fleet_control_fetch_failures_total{namespace="copilot"}[15m])) > 0
          for: 15m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: mcp-registry
          annotations:
            summary: mcp-registry has failed to fetch or validate fleet-control registry snapshots for 15 minutes
            consequence: The pods keep serving their last server list, so changes published in fleet-control do not reach the registry.
            action: "Search mcp-registry pod logs for the error; it says whether Texas or fleet-control is down or the snapshot is refused (size, schema, generation, validation)."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/mcp-registry/README.md#fleet-control-source
{{/if}}
