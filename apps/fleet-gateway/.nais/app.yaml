apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fleet-gateway
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 10
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      replyURLs:
      {{#each reply_urls as |url|}}
        - {{url}}
      {{/each}}
  {{#if postgres}}
  # TODO(#2221): provisioning is Nais Postgres (spec.uses.postgres, dev only for now);
  # the Cloud SQL option (gcp.sqlInstances) is deliberately not used.
  uses:
    postgres:
      - name: {{postgres}}
  envFrom:
    - secret: fleet-gateway-rt-keys # key RT_KEYS = "kid:base64key,..." (newest first); created by a human
  {{/if}}
  env:
    - name: SESSION_STORE
      value: "{{session_store}}"
    - name: SESSION_MAX_AGE
      value: "{{session_max_age}}"
    - name: RT_STORAGE
      value: "{{rt_storage}}"
    - name: TEAM_TOKEN_STRATEGY
      value: "{{team_token_strategy}}"
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "{{log_level}}"
    - name: BASE_URL
      value: "{{base_url}}"
    - name: ALLOWED_CLIENT_IDS
      value: "{{allowed_client_ids}}"
    - name: ALLOWED_REDIRECT_URIS
      value: "{{allowed_redirect_uris}}"
    {{#if dcr_enabled}}
    - name: DCR_ENABLED
      value: "{{dcr_enabled}}"
    {{/if}}
    {{#if pilot_routes_file}}
    - name: PILOT_ROUTES_FILE
      value: "{{pilot_routes_file}}"
    {{/if}}
  accessPolicy:
    outbound:
      rules:
      {{#each outbound_rules}}
        - application: {{application}}
      {{/each}}
      external:
        - host: login.microsoftonline.com
      {{#each cimd_hosts as |host|}}
        - host: "{{host}}"
      {{/each}}
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
