apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fleet-gateway
  namespace: copilot
  labels:
    team: copilot
  annotations:
    # HAProxy cuts after 60 s by default; must exceed the gateway's 145 s WriteTimeout (#2383).
    haproxy.org/timeout-server: "150s"
    haproxy.org/timeout-client: "150s"
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  # /metrics is on its own port (METRICS_PORT), which has no ingress.
  prometheus:
    enabled: true
    path: /metrics
    port: "9090"
  # Covers fleet-gateway's shutdown drain (maxShutdownDrain, 170 s) plus the preStop sleep.
  terminationGracePeriodSeconds: 180
  liveness:
    path: /health
    initialDelay: 10
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      replyURLs:
      {{#each reply_urls as |url|}}
        - {{url}}
      {{/each}}
  {{#if postgres}}
  # TODO(#2221): provisioning is Nais Postgres (spec.uses.postgres, dev only for now);
  # the Cloud SQL option (gcp.sqlInstances) is deliberately not used.
  uses:
    postgres:
      - name: {{postgres}}
  envFrom:
    - secret: fleet-gateway-rt-keys # key RT_KEYS = "kid:base64key,..." (newest first); created by a human
    - secret: fleet-gateway-lockout-key # key LOCKOUT_KEY (at least 32 bytes); created by a human in dev-gcp and prod-gcp (#2436)
  {{/if}}
  env:
    # Soft heap limit below the container limit, so GC runs before an OOM kill (README, Memory and limits).
    - name: GOMEMLIMIT
      value: "{{gomemlimit}}"
    - name: SESSION_STORE
      value: "{{session_store}}"
    - name: SESSION_MAX_AGE
      value: "{{session_max_age}}"
    - name: RT_STORAGE
      value: "{{rt_storage}}"
    - name: TEAM_TOKEN_STRATEGY
      value: "{{team_token_strategy}}"
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "{{log_level}}"
    - name: BASE_URL
      value: "{{base_url}}"
    - name: ALLOWED_CLIENT_IDS
      value: "{{allowed_client_ids}}"
    - name: ALLOWED_REDIRECT_URIS
      value: "{{allowed_redirect_uris}}"
    {{#if dcr_enabled}}
    - name: DCR_ENABLED
      value: "{{dcr_enabled}}"
    {{/if}}
    {{#if identity_source}}
    - name: IDENTITY_SOURCE
      value: "{{identity_source}}"
    {{/if}}
    {{#if routes_source}}
    - name: ROUTES_SOURCE
      value: "{{routes_source}}"
    {{/if}}
    {{#if routes_shadow_source}}
    - name: ROUTES_SHADOW_SOURCE
      value: "{{routes_shadow_source}}"
    {{/if}}
    {{#if fleet_control_audience}}
    - name: FLEET_CONTROL_URL
      value: "http://fleet-control"
    - name: FLEET_CONTROL_AUDIENCE
      value: "{{fleet_control_audience}}"
    {{/if}}
    {{#if pilot_routes_file}}
    - name: PILOT_ROUTES_FILE
      value: "{{pilot_routes_file}}"
    {{/if}}
  accessPolicy:
    outbound:
      # In-cluster egress comes from the NetworkPolicy fleet-gateway-egress
      # below: Nais drops outbound rules with application "*".
      external:
        - host: login.microsoftonline.com
      {{#each cimd_hosts as |host|}}
        - host: "{{host}}"
      {{/each}}
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
---
# Owner decision 2026-11-25 (#2985): the gateway may reach any pod in the
# cluster, so a new MCP server needs no change here. Security rests on the
# receiver: its inbound accessPolicy (default deny) and Entra azp validation.
# naiserator skips outbound rules with application "*" (networkpolicy.go,
# egressRulesFromAccessPolicy), so this is a plain NetworkPolicy. Policies are
# additive: it widens the egress the Application already gets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-gateway-egress
  namespace: copilot
  labels:
    team: copilot
spec:
  podSelector:
    matchLabels:
      app: fleet-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        # Team namespaces only. Every namespace without a team label is a
        # platform namespace (kube-system, nais-system, kyverno, cnrm-system,
        # gke-managed-*, ...): `kubectl get ns -l '!team'` on 2026-11-25.
        - namespaceSelector:
            matchExpressions:
              - { key: team, operator: Exists }
          podSelector: {}
---
# Alerts for fleet-gateway. The 5xx and token rules need some traffic before they
# can fire, so a quiet dev cluster stays silent. stream_error from an idle SSE
# stream is not counted: the 200 status was sent before the stream broke.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fleet-gateway-alerts
  namespace: copilot
  labels:
    team: copilot
spec:
  groups:
    # SLO recording rules (runbook "SLO"). Alerts and dashboards (#2916) read these names.
    # "or total * 0" makes errors 0, not a gap, on a route with traffic but no bad series yet;
    # metrics.Init pre-creates only upstream_token_error. A route without traffic stays a gap (unknown).
    - name: fleet-gateway-slo
      rules:
        - record: fleet_gateway:slo_availability_errors:ratio_rate5m
          expr: |
            (sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome=~"store_error|upstream_token_error|over_capacity|sse_over_capacity|user_cap|user_sse_cap"}[5m]))
              or sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[5m])) * 0)
              / sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[5m]))
        - record: fleet_gateway:slo_availability_errors:ratio_rate1h
          expr: |
            (sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome=~"store_error|upstream_token_error|over_capacity|sse_over_capacity|user_cap|user_sse_cap"}[1h]))
              or sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[1h])) * 0)
              / sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[1h]))
        - record: fleet_gateway:slo_availability_errors:ratio_rate6h
          expr: |
            (sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome=~"store_error|upstream_token_error|over_capacity|sse_over_capacity|user_cap|user_sse_cap"}[6h]))
              or sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[6h])) * 0)
              / sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[6h]))
        - record: fleet_gateway:slo_availability_errors:ratio_rate1d
          expr: |
            (sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome=~"store_error|upstream_token_error|over_capacity|sse_over_capacity|user_cap|user_sse_cap"}[1d]))
              or sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[1d])) * 0)
              / sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[1d]))
        - record: fleet_gateway:slo_availability_requests:increase6h
          expr: sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[6h]))
        - record: fleet_gateway:slo_availability_requests:increase1d
          expr: sum by (namespace, route) (increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome!~"unauthorized|disabled|tool_denied"}[1d]))
        - record: fleet_gateway:slo_5xx:ratio_rate1d
          expr: |
            sum by (namespace) (increase(fleet_gateway_http_requests_total{namespace="copilot", code=~"5..", reason=""}[1d]))
              / sum by (namespace) (increase(fleet_gateway_http_requests_total{namespace="copilot"}[1d]))
            and on (namespace) sum by (namespace) (increase(fleet_gateway_http_requests_total{namespace="copilot"}[1d])) >= 20
    - name: fleet-gateway
      rules:
        - alert: FleetGatewayRouteSnapshotStale
          expr: max(fleet_gateway_route_snapshot_age_seconds{namespace="copilot"}) > 600
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: A fleet-gateway pod has not fetched a fleet-control route snapshot for more than 10 minutes
            consequence: The pod keeps serving its last route table, so route changes and revocations in fleet-control do not reach it.
            action: "Check fleet-control health and its Postgres, then search fleet-gateway pod logs for `fleet-control routes not updated`."
        - alert: FleetGatewayRouteSyncFailing
          expr: sum(increase(fleet_gateway_route_sync_failures_total{namespace="copilot"}[15m])) > 0
          for: 15m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway has failed to fetch or validate fleet-control route snapshots for 15 minutes
            consequence: The pods keep serving their last route table, so route changes and revocations in fleet-control do not reach them.
            action: "Search fleet-gateway pod logs for `fleet-control routes not updated`; the error says whether fleet-control is down or its snapshot is refused (contract mismatch, see docs/runbook.md)."
{{#if routes_source}}
        - alert: FleetGatewayRouteNeverSynced
          # The age gauge appears on the first successful sync (#2637), so the stale alert cannot see a pod that never synced.
          # Evaluated per cluster today; the source selector keeps it correct if deployed in prod or evaluated tenant-wide (#2949).
          expr: fleet_gateway_routes_source_info{namespace="copilot", source="fleet-control"} unless on(pod, k8s_cluster_name) fleet_gateway_route_snapshot_age_seconds{namespace="copilot"}
          for: 15m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: A fleet-gateway pod has run for 15 minutes without one successful fleet-control route sync
            consequence: The pod serves no route table from fleet-control, so MCP routes fail closed.
            action: "Search the pod's logs for `fleet-control routes not updated` and check fleet-control health."
{{/if}}
        - alert: FleetGatewayNoReadyPods
          expr: sum by (k8s_cluster_name) (kube_deployment_status_replicas_available{namespace="copilot", deployment="fleet-gateway"}) == 0
          for: 2m
          labels:
            namespace: copilot
            severity: critical
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway has no ready pods
            consequence: Every MCP call through the gateway fails.
            action: "Check `kubectl -n copilot get pods -l app=fleet-gateway` and the pod logs. Usual causes: a bad route file or RT_KEYS."
        - alert: FleetGatewayStoreDown
          expr: min(fleet_gateway_store_up{namespace="copilot"}) == 0
          for: 2m
          labels:
            namespace: copilot
            severity: critical
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: A fleet-gateway pod cannot reach its Postgres
            consequence: Pods stay in rotation and route from the stored snapshot, but logins, token refresh and sessions fail.
            action: "Check the fleet-gateway Postgres in Nais Console and search pod logs for `session store ping failed`."
        - alert: FleetGatewayPodRestarts
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="copilot", container="fleet-gateway"}[15m])) > 2
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway restarted more than twice in 15 minutes
            consequence: Calls in flight are cut. OOMKilled means the memory limit is too low for the bodies being buffered.
            action: "Run `kubectl -n copilot describe pod -l app=fleet-gateway` and look at Last State."
        - alert: FleetGatewayHigh5xxRate
          expr: |
            sum by (k8s_cluster_name) (rate(fleet_gateway_http_requests_total{namespace="copilot", code=~"5..", reason=""}[5m]))
              / sum by (k8s_cluster_name) (rate(fleet_gateway_http_requests_total{namespace="copilot"}[5m])) > 0.1
            and sum by (k8s_cluster_name) (increase(fleet_gateway_http_requests_total{namespace="copilot"}[5m])) > 20
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: More than 10 % of fleet-gateway responses are 5xx
            description: Deliberate 503s (kill switch, in-flight cap, store quota, concurrent refresh) carry a non-empty reason label and are not counted.
            consequence: Users get errors on login or MCP calls.
            action: "Break down `fleet_gateway_mcp_requests_total` by route and outcome, then read the `audit mcp` log lines for that route."
        - alert: FleetGatewayAvailabilityBurnFast
          expr: |
            fleet_gateway:slo_availability_errors:ratio_rate1h{namespace="copilot"} > 0.072
            and fleet_gateway:slo_availability_errors:ratio_rate5m{namespace="copilot"} > 0.072
            and fleet_gateway:slo_availability_requests:increase6h{namespace="copilot"} >= 20
          labels:
            namespace: copilot
            severity: critical
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: "A route burns its monthly 99.5 % availability budget 14.4 times too fast (1 h and 5 min)"
            consequence: Users get errors caused by the gateway itself on the route in the route label. Upstream errors, 401 handshakes, tool denials and the kill switch are not counted.
            action: "Break down `fleet_gateway_mcp_requests_total` by outcome for the route, then follow the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-gateway/docs/runbook.md#availability-burn-rate
        - alert: FleetGatewayAvailabilityBurnSlow
          expr: |
            fleet_gateway:slo_availability_errors:ratio_rate1d{namespace="copilot"} > 0.03
            and fleet_gateway:slo_availability_errors:ratio_rate6h{namespace="copilot"} > 0.03
            and fleet_gateway:slo_availability_requests:increase1d{namespace="copilot"} >= 20
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: "A route burns its monthly 99.5 % availability budget 6 times too fast (1 d and 6 h)"
            consequence: Users get errors caused by the gateway itself on the route in the route label. Upstream errors, 401 handshakes, tool denials and the kill switch are not counted.
            action: "Break down `fleet_gateway_mcp_requests_total` by outcome for the route, then follow the runbook."
            runbook_url: https://github.com/navikt/copilot/blob/main/apps/fleet-gateway/docs/runbook.md#availability-burn-rate
        - alert: FleetGatewaySustainedShedding
          expr: sum by (reason) (increase(fleet_gateway_http_requests_total{namespace="copilot", code="503", reason=~"store_full|cap"}[5m])) > 5
          for: 15m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: More than 5 deliberate 503s (store_full or cap) per 5 minutes for 15 minutes; the reason label says which
            consequence: "store_full: new logins and registrations fail. cap: MCP calls get 503 over capacity."
            action: "store_full: count rows per kind in the session store and look for a client registering in a loop. cap: check `fleet_gateway_mcp_requests_total` by route and slow upstreams."
        - alert: FleetGatewaySustainedRateLimiting
          expr: sum by (oauth_endpoint) (increase(fleet_gateway_rate_limited_total{namespace="copilot"}[5m])) > 20
          for: 15m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: More than 20 rate-limited requests per 5 minutes for 15 minutes on an unauthenticated endpoint; the endpoint label says which
            consequence: Clients on that endpoint get 429 Too Many Requests from the per-IP or global limit.
            action: "Check `fleet_gateway_rate_limited_total` by endpoint and search pod logs for `rate limited`."
        - alert: FleetGatewayUpstreamTokenErrors
          expr: sum(increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome="upstream_token_error"}[10m])) > 5
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway failed to get upstream team tokens more than 5 times in 10 minutes
            consequence: MCP calls fail with 502 upstream_token_error.
            action: "Find `team token failed` in the logs; the reason carries the AADSTS code. Check Entra ID status and the team's app registration."
---
# Sends fleet-gateway's custom alerts to #github-copilot-alerts, as copilot-survey does.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: fleet-gateway-slack
  namespace: copilot
  labels:
    alertmanagerConfig: fleet-gateway-slack
spec:
  receivers:
    - name: fleet-gateway-slack
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: apiUrl
          channel: "#github-copilot-alerts"
          sendResolved: true
          title: '\{{ template "slack.title" . }}'
          text: '\{{ template "slack.text" . }}'
          color: '\{{ template "slack.color" . }}'
  route:
    groupBy:
      - alertname
    matchers:
      - name: namespace
        matchType: "="
        value: copilot
      - name: alert_type
        matchType: "="
        value: custom
      - name: app
        matchType: "="
        value: fleet-gateway
    receiver: fleet-gateway-slack
