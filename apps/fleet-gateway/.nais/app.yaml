apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fleet-gateway
  namespace: copilot
  labels:
    team: copilot
  annotations:
    # HAProxy cuts after 60 s by default; must exceed the gateway's 145 s WriteTimeout (#2383).
    haproxy.org/timeout-server: "150s"
    haproxy.org/timeout-client: "150s"
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  # /metrics is on its own port (METRICS_PORT), which has no ingress.
  prometheus:
    enabled: true
    path: /metrics
    port: "9090"
  liveness:
    path: /health
    initialDelay: 10
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      replyURLs:
      {{#each reply_urls as |url|}}
        - {{url}}
      {{/each}}
  {{#if postgres}}
  # TODO(#2221): provisioning is Nais Postgres (spec.uses.postgres, dev only for now);
  # the Cloud SQL option (gcp.sqlInstances) is deliberately not used.
  uses:
    postgres:
      - name: {{postgres}}
  envFrom:
    - secret: fleet-gateway-rt-keys # key RT_KEYS = "kid:base64key,..." (newest first); created by a human
  {{/if}}
  env:
    # Soft heap limit below the container limit, so GC runs before an OOM kill (README, Memory and limits).
    - name: GOMEMLIMIT
      value: "{{gomemlimit}}"
    - name: SESSION_STORE
      value: "{{session_store}}"
    - name: SESSION_MAX_AGE
      value: "{{session_max_age}}"
    - name: RT_STORAGE
      value: "{{rt_storage}}"
    - name: TEAM_TOKEN_STRATEGY
      value: "{{team_token_strategy}}"
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "{{log_level}}"
    - name: BASE_URL
      value: "{{base_url}}"
    - name: ALLOWED_CLIENT_IDS
      value: "{{allowed_client_ids}}"
    - name: ALLOWED_REDIRECT_URIS
      value: "{{allowed_redirect_uris}}"
    {{#if dcr_enabled}}
    - name: DCR_ENABLED
      value: "{{dcr_enabled}}"
    {{/if}}
    {{#if pilot_routes_file}}
    - name: PILOT_ROUTES_FILE
      value: "{{pilot_routes_file}}"
    {{/if}}
  accessPolicy:
    outbound:
      rules:
      {{#each outbound_rules}}
        - { application: {{application}}{{#if namespace}}, namespace: {{namespace}}{{/if}}{{#if cluster}}, cluster: {{cluster}}{{/if}} }
      {{/each}}
      external:
        - host: login.microsoftonline.com
      {{#each cimd_hosts as |host|}}
        - host: "{{host}}"
      {{/each}}
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
---
# Alerts for fleet-gateway. The 5xx and token rules need some traffic before they
# can fire, so a quiet dev cluster stays silent. stream_error from an idle SSE
# stream is not counted: the 200 status was sent before the stream broke.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fleet-gateway-alerts
  namespace: copilot
  labels:
    team: copilot
spec:
  groups:
    - name: fleet-gateway
      rules:
        - alert: FleetGatewayNoReadyPods
          expr: sum(kube_deployment_status_replicas_available{namespace="copilot", deployment="fleet-gateway"}) == 0
          for: 2m
          labels:
            namespace: copilot
            severity: critical
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway has no ready pods
            consequence: Every MCP call through the gateway fails.
            action: "Check `kubectl -n copilot get pods -l app=fleet-gateway` and the pod logs. Usual causes: Postgres unreachable, a bad route file or RT_KEYS."
        - alert: FleetGatewayPodRestarts
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="copilot", container="fleet-gateway"}[15m])) > 2
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway restarted more than twice in 15 minutes
            consequence: Calls in flight are cut. OOMKilled means the memory limit is too low for the bodies being buffered.
            action: "Run `kubectl -n copilot describe pod -l app=fleet-gateway` and look at Last State."
        - alert: FleetGatewayHigh5xxRate
          expr: |
            sum(rate(fleet_gateway_http_requests_total{namespace="copilot", code=~"5..", reason=""}[5m]))
              / sum(rate(fleet_gateway_http_requests_total{namespace="copilot"}[5m])) > 0.1
            and sum(increase(fleet_gateway_http_requests_total{namespace="copilot"}[5m])) > 20
          for: 5m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: More than 10 % of fleet-gateway responses are 5xx
            description: Deliberate 503s (kill switch, in-flight cap, store quota, concurrent refresh) carry a non-empty reason label and are not counted.
            consequence: Users get errors on login or MCP calls.
            action: "Break down `fleet_gateway_mcp_requests_total` by route and outcome, then read the `audit mcp` log lines for that route."
        - alert: FleetGatewaySustainedShedding
          expr: sum by (reason) (increase(fleet_gateway_http_requests_total{namespace="copilot", code="503", reason=~"store_full|cap"}[5m])) > 5
          for: 15m
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: More than 5 deliberate 503s (store_full or cap) per 5 minutes for 15 minutes; the reason label says which
            consequence: "store_full: new logins and registrations fail. cap: MCP calls get 503 over capacity."
            action: "store_full: count rows per kind in the session store and look for a client registering in a loop. cap: check `fleet_gateway_mcp_requests_total` by route and slow upstreams."
        - alert: FleetGatewayUpstreamTokenErrors
          expr: sum(increase(fleet_gateway_mcp_requests_total{namespace="copilot", outcome="upstream_token_error"}[10m])) > 5
          labels:
            namespace: copilot
            severity: warning
            alert_type: custom
            app: fleet-gateway
          annotations:
            summary: fleet-gateway failed to get upstream team tokens more than 5 times in 10 minutes
            consequence: MCP calls fail with 502 upstream_token_error.
            action: "Find `team token failed` in the logs; the reason carries the AADSTS code. Check Entra ID status and the team's app registration."
---
# Sends fleet-gateway's custom alerts to #github-copilot-alerts, as copilot-survey does.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: fleet-gateway-slack
  namespace: copilot
  labels:
    alertmanagerConfig: fleet-gateway-slack
spec:
  receivers:
    - name: fleet-gateway-slack
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: apiUrl
          channel: "#github-copilot-alerts"
          sendResolved: true
          title: '\{{ template "slack.title" . }}'
          text: '\{{ template "slack.text" . }}'
          color: '\{{ template "slack.color" . }}'
  route:
    groupBy:
      - alertname
    matchers:
      - name: namespace
        matchType: "="
        value: copilot
      - name: alert_type
        matchType: "="
        value: custom
      - name: app
        matchType: "="
        value: fleet-gateway
    receiver: fleet-gateway-slack
