apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fleet-echo
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
    cpuThresholdPercentage: {{cpu_threshold}}
  resources:
    limits:
      memory: {{memory_limit}}
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
  liveness:
    path: /health
    initialDelay: 10
    timeout: 5
  readiness:
    path: /ready
    initialDelay: 10
    timeout: 5
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
  env:
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "{{log_level}}"
  accessPolicy:
    inbound:
      rules:
        - application: fleet-gateway
          namespace: copilot
