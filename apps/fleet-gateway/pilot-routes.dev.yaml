version: 2
routes:
  - route: /mcp/copilot/test
    team: copilot
    target: dev-gcp:copilot:fleet-echo
    upstream_url: http://fleet-echo.copilot/
    tools: [whoami]
  - route: /mcp/copilot/onboarding
    team: copilot
    target: dev-gcp:copilot:mcp-onboarding
    upstream_url: http://mcp-onboarding.copilot/mcp/gw
    passAllTools: true
  - route: /mcp/copilot/kodeverk
    team: copilot
    target: dev-gcp:copilot:mcp-kodeverk
    upstream_url: http://mcp-kodeverk.copilot/
    enabled: false
    tools:
      - list_kodeverk
      - get_kodeverk_koder
      - get_kodeverk_betydninger
      - list_hierarkier
      - get_hierarki_noder
      - search_kodeverk
