version: 2
routes:
  - route: /mcp/copilot/test
    team: copilot
    target: dev-gcp:copilot:fleet-echo
    upstream_url: http://fleet-echo.copilot/
    tools: [whoami]
  - route: /mcp/copilot/onboarding
    team: copilot
    target: dev-gcp:copilot:mcp-onboarding
    upstream_url: http://mcp-onboarding.copilot/mcp/gw
    tools: [hello_world, greet, whoami, echo, get_time, search_customizations, list_agents, list_instructions, list_prompts, list_skills, get_installation_guide, check_agent_readiness, suggest_customizations, generate_agents_md, generate_setup_steps, team_readiness]
  - route: /mcp/copilot/dolly
    team: copilot
    target: dev-gcp:copilot:mcp-dolly
    upstream_url: http://mcp-dolly.copilot/
    # Same Dolly dev backend as prod (#2662); token store, quota and Postgres are per cluster.
    tools:
      - dolly_current_user
      - dolly_list_groups
      - dolly_get_group
      - dolly_search
      - dolly_get_order
      - dolly_list_group_orders
      - create_order
  - route: /mcp/copilot/kodeverk
    team: copilot
    target: dev-gcp:copilot:mcp-kodeverk
    upstream_url: http://mcp-kodeverk.copilot/
    enabled: false
    tools:
      - list_kodeverk
      - get_kodeverk_koder
      - get_kodeverk_betydninger
      - list_hierarkier
      - get_hierarki_noder
      - search_kodeverk
  - route: /mcp/copilot/team-catalog
    team: copilot
    target: dev-gcp:copilot:mcp-team-catalog
    upstream_url: http://mcp-team-catalog.copilot/
    tools:
      - list_teams
      - search_teams
      - get_team
      - get_teams_by_nais_team
      - list_product_areas
      - get_product_area
      - list_clusters
      - get_cluster
      - get_member_memberships
      - get_nais_team
  - route: /mcp/aksel-studio/studio
    team: aksel-studio
    target: dev-gcp:aksel-studio:studio-api
    upstream_url: http://studio-api.aksel-studio/mcp
    tools:
      - list_konsepter
      - les_konsept
      - les_fil
      - les_komponentregister
      # Write tools (ADR 033 in navikt/aksel-studio): dev only until a server ROS exists.
      - lag_konsept
      - foresla_ny_fil
      - foresla_endring
