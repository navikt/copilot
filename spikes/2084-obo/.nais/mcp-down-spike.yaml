# Spike for navikt/copilot#2084, dev-gcp only. Do not merge.
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: mcp-down-spike
  namespace: copilot
  labels:
    team: copilot
spec:
  image: {{image}}
  port: 8080
  replicas: {min: 1, max: 1}
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}
  liveness: {path: /isalive}
  readiness: {path: /isalive}
  azure:
    application:
      enabled: true
      tenant: nav.no
      # Group-restricted test: set down_group_id in vars.yaml (a group in the nav.no tenant).
      # Empty keeps allowAllUsers so the chain test still runs.
      allowAllUsers: {{#if down_group_id}}false{{else}}true{{/if}}
      {{#if down_group_id}}
      claims:
        groups:
          - id: "{{down_group_id}}"
      {{/if}}
  accessPolicy:
    inbound:
      rules:
        - application: mcp-team-spike
    outbound:
      rules:
        []

