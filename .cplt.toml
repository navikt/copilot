# cplt sandbox settings for this repository.
#
# This file cannot grant anything by itself. Every [propose] entry is a request
# that each developer reviews and approves with `cplt trust` (or declines).
# Only entries backed by a failure we have reproduced under cplt belong here.
# Machine-specific grants (pnpm config path, caches, credentials) go in your
# own ~/.config/cplt/config.toml, not here.
#
# What works with no approvals at all: `mise run generate`, `mise run build`,
# go vet/staticcheck, eslint, tsc and `pnpm install` (cplt 2026.09.29 or
# newer, see the end). Tests and the dev server need allow_localhost_any below.

[propose]
# Next.js dev server (apps/my-copilot, `pnpm dev`). Turbopack starts node
# worker processes and talks to them over random localhost ports. With only
# port 3000 allowed the server starts, but the first page request fails with
# "node process exited before we could connect to it" and returns 500.
# Go tests that use httptest.NewServer (copilot-api: TestJWKSCache and others)
# listen on a random 127.0.0.1 port and fail with "connect: operation not
# permitted" without it.
# Cost: this reaches ANY local listener (databases, local model/MCP servers,
# Docker if exposed on TCP). On Linux/WSL cplt then drops kernel TCP filtering
# for all remote hosts and only the HTTP(S) proxy remains (cplt docs/security.md).
# Still the narrowest option: allow.localhost takes fixed ports only, and the
# Turbopack worker and httptest ports are random.
allow_localhost_any = true

# Docker is NOT needed for the normal workflow: root build/check/generate use
# `go build` and `pnpm`, and CI builds the images. Only the per-app
# `mise run docker:build` / `docker:run` / `mise run ci` call docker; run those outside cplt.
# Docker-socket access is effectively root on the host, so it stays off:
# allow_docker = true

[propose.allow]
# Talk to dev servers you started yourself outside the sandbox (`mise dev`
# needs Keychain secrets through fnox, which cplt does not hand to the agent):
# my-copilot on 3000, copilot-api on 8080. Narrower than allow_localhost_any,
# so you can approve this and decline the one above.
localhost = [3000, 8080]

# Removed from the `cplt init` draft:
# - read ~/.config/gcloud/application_default_credentials.json: a Google
#   refresh token for your whole account. Only the BigQuery apps' `dev` tasks
#   use it, and those also need Keychain secrets, so they cannot run in the
#   sandbox anyway.
# - read ~/.config/gcloud/virtenv/bin: only used by the gcloud CLI, which no
#   task here runs.
#
# pnpm on older cplt: builds before 2026.09.29-113343 could not run
# `pnpm install` (navikt/cplt#616 config.yaml, navikt/cplt#618 packages that
# ship a .claude/ directory). Both are fixed; run `cplt update` or
# `brew upgrade cplt` instead of adding a grant.
